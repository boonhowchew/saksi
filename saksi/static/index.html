      <dt>Sample</dt><dd>${esc(d.n)} analysed${d.events != null ? `, ${esc(d.events)} with the outcome` : ""}; ${esc(d.predictor_parameters)} predictor parameters${a.events_per_parameter != null ? `; ${esc(a.events_per_parameter)} events per parameter (at least 10 recommended)` : ""}${a.observations_per_parameter != null ? `; ${esc(a.observations_per_parameter)} observations per parameter` : ""}</dd>
      ${d.model === "logistic" ? `<dt>Overall fit</dt><dd>Likelihood-ratio χ² ${num(lr.chi2, 2)} on ${esc(lr.df)} df against the null model, p ${pval(lr.p_value)}</dd>
      <dt>Discrimination</dt><dd>C-statistic ${num(f.c_statistic, 3)}</dd>
      <dt>Calibration</dt><dd>Slope ${num(cal.slope, 2)}, intercept ${num(cal.intercept, 2)}; Hosmer-Lemeshow χ² ${num(hl.chi2, 2)}, p ${pval(hl.p_value)} (read with the calibration plot)${cal.apparent ? `<br><span class="small muted">Apparent calibration: ${esc(cal.apparent)}.</span>` : ""}</dd>
      <dt>Pseudo-R²</dt><dd>${num(f.pseudo_r2_mcfadden, 3)} (McFadden; a secondary indicator only)</dd>`
      : `<dt>Fit</dt><dd>R² ${num(f.r2, 3)}, adjusted R² ${num(f.adjusted_r2, 3)}; F-test p ${pval(f.f_test?.p_value)}</dd>
      <dt>Residuals</dt><dd>Shapiro-Wilk p ${pval(a.residual_normality_shapiro?.p_value)}; Breusch-Pagan p ${pval(a.homoscedasticity_breusch_pagan?.p_value)}</dd>`}
      <dt>Collinearity</dt><dd>${vifs ? `VIF ${vifs}` : "a single predictor"}${(col.high_correlations || []).length ? `; correlations above 0.8: ${col.high_correlations.map((c) => `${esc(c.a)} and ${esc(c.b)} (${num(c.r, 2)})`).join(", ")}` : ""}</dd>
      ${bt ? `<dt>Linearity of the logit</dt><dd>Box-Tidwell: ${bt}</dd>` : ""}
      <dt>Influence</dt><dd>${esc(i.cooks_above_4_over_n)} observations with Cook's distance above 4/n (largest ${num(i.cooks_distance_max, 3)}; ${esc(i.cooks_above_1 ?? 0)} above 1)${d.model === "logistic" ? `; ${esc(i.pearson_residuals_beyond_2)} Pearson residuals beyond ±2; DfBeta above ${num(i.dfbeta_threshold, 3)}: ${esc(Object.entries(i.dfbeta_above_threshold || {}).map(([k, v]) => `${k} ${v}`).join(", "))}` : `; ${esc(i.standardised_residuals_beyond_2)} standardised residuals beyond ±2`}</dd>
      <dt>Independence</dt><dd>${esc(a.independence)}</dd>
    </dl></div>`;
}

async function analysisBlock(id, a, tables = [], canAsk = false) {
  const s = S.state, ex = a.execution || {}, pv = ex.provenance || {};
  const out = a.status === "ok" ? await blobJSON(a.outputs_sha256) : null;
  const est = out?.estimates || [];
  const pub0 = tables.find((t) => t.analysis_id === id), pub = pub0?.number ? pub0 : null;
  let body;
  if (!out) body = `<p class="msg err small">${esc(a.error || "")}</p>`;
  else if (a.standard === "data_quality") body = qualityHtml(out);
  else if (a.standard === "table1") body = pub ? pubTableHtml(pub, { note: TABLE_NOTE }) : table1Html(out);
  else if (pub) body = `${pubTableHtml(pub, { note: TABLE_NOTE })}
      ${(out.notes || []).length ? `<details class="small"><summary>The Analysis Agent's notes</summary><ul>${out.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></details>` : ""}
      ${diagnosticsHtml(out.diagnostics)}
      ${a.kind === "multivariable" && !out.diagnostics ? `<p class="msg warn small">The standard diagnostics are missing for this multivariable model${ex.diagnostics_missing ? ", even after the Analysis Agent was asked to add them" : ""}. Its results should not be relied on until they are checked.</p>` : ""}`;
  else body = `<p class="small">${out.n_analysed != null ? `Analysed ${esc(out.n_analysed)}${out.n_events != null ? `, with ${esc(out.n_events)} outcome events` : ""}${out.n_excluded != null ? `; excluded ${esc(out.n_excluded)}${out.exclusion_reason ? ` (${esc(out.exclusion_reason)})` : ""}` : "; exclusions not reported"}. ` : ""}${esc(out.model?.formula_or_description || "")}</p>
      ${est.length ? `<div class="tablewrap"><table><thead><tr><th>Term</th><th>Measure</th><th>Estimate</th><th>95% CI</th><th>p</th></tr></thead><tbody>
      ${est.map((e) => `<tr><td>${esc(e.name)}</td><td>${esc(e.measure)}</td><td class="num">${num(e.estimate)}</td><td class="num">${e.ci_lower != null ? num(e.ci_lower) + " to " + num(e.ci_upper) : ""}</td><td class="num">${pval(e.p_value)}</td></tr>`).join("")}</tbody></table></div>` : ""}
      ${(out.notes || []).length ? `<ul class="small">${out.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      ${diagnosticsHtml(out.diagnostics)}
      ${a.kind === "multivariable" && !out.diagnostics ? `<p class="msg warn small">The standard diagnostics are missing for this multivariable model${ex.diagnostics_missing ? ", even after the Analysis Agent was asked to add them" : ""}. Its results should not be relied on until they are checked.</p>` : ""}`;
  return `<div class="item ${a.status === "ok" ? "good" : "attn"}">
    <h3>${esc(a.spec?.title || id)} ${a.standard ? `<span class="tag">descriptive</span>` : labelTag(a)}
      ${canAsk && !a.superseded_by && a.status === "ok" && !a.standard ? `<button class="linkish small" data-action="openask" data-id="${esc(id)}" title="Ask the Analysis Agent to run a variant or redo this analysis"><span class="aibadge">AI</span>change</button>` : ""}
      <span class="tag ${a.status === "ok" ? "good" : "bad"}">${a.status === "ok" ? "ran" : "failed"}</span> <span class="muted small">${esc(id)}</span></h3>
    ${a.superseded_by ? `<p class="msg warn small">Replaced by ${esc(a.superseded_by)}; kept in the record. It is not part of the paper.</p>` : ""}
    ${a.supersedes ? `<p class="msg small">${a.standard ? "Rebuilt" : "Redone"} at the request of ${esc(name(a.requested_by))}: “${esc(a.redo_reason)}”. It replaces ${esc(a.supersedes)}, which is kept below.${a.standard ? "" : " The label was fixed before any result and does not change."}</p>` : ""}
    ${a.spec?.based_on ? `<p class="small">A variant of <strong>${esc(a.spec.based_on.title)}</strong> (${esc(a.spec.based_on.analysis_id)}), asked for after its results were seen, so exploratory. The original is reported too.</p>` : ""}
    ${sampleBlock(a.sample_check)}
    ${departureHtml(a.protocol_deviation)}
    ${a.requested_by ? `<p class="small muted">${a.standard ? "Run" : "Requested"} by ${esc(name(a.requested_by))}${a.spec?.author_request ? `: “${esc(a.spec.author_request)}”` : ""}</p>` : ""}
    ${await descriptionHtml(id, a, tables, canAsk)}
    ${body}
    ${(await Promise.all(s.figures.filter((f) => f.analysis_id === id).map(figureHtml))).join("")}
    ${ex.required_figure && !ex.required_figure_drawn ? `<p class="msg warn small">The rule for this analysis requires a ${esc(ex.required_figure.replaceAll("_", " "))}, but the analysis code did not draw one.${ex.figure_error ? " The figure code failed; see How it ran." : ""}</p>` : ""}
    <details><summary>How it ran</summary><dl class="facts">
      <dt>Code by</dt><dd>${esc(ex.code_by || "the Analysis Agent (" + (s.actors["agent:analyst"]?.model || "") + ")")}</dd>

      <dt>Network</dt><dd>${pv.network === "blocked" ? `<span class="tag good">blocked</span>` : esc(pv.network || "not recorded")}</dd>
      <dt>Data</dt><dd>${pv.data_sha256 && pv.data_sha256 === ex.dataset_sha256 ? `<span class="tag good">same file as uploaded</span>` : `<span class="tag attn">not confirmed</span>`} <span class="hash">${short(ex.dataset_sha256)}</span></dd>
      <dt>Seed</dt><dd>${esc(ex.seed)}</dd>
      <dt>Attempts</dt><dd>${(ex.attempts || []).map((t) => esc(t.outcome.replaceAll("_", " "))).join(", then ")}</dd>
      <dt>Packages</dt><dd class="small">${esc(Object.entries(pv.packages || {}).map(([k, v]) => k + " " + v).join(", "))}</dd>

    ${canAsk && !a.superseded_by && a.status === "ok" ? askBox(id, a) : ""}
    ${canAsk && !a.superseded_by && !a.withdrawn && a.basis === "post hoc" ? `<details class="small"><summary>Leave this exploratory analysis out of the paper</summary>
      <form class="stack" data-form="withdrawanalysis" data-id="${esc(id)}"><label><span>Why (kept in the record and shown to the reviewer)</span><input type="text" name="reason" required placeholder="For example: superseded by Table 1"></label>
      <div><button class="btn quiet" data-label="Leaving it out">Leave it out</button></div></form></details>` : ""}
    ${a.supersedes && s.analyses[a.supersedes] ? `<details class="replaced"><summary>The earlier run, ${esc(a.supersedes)}, replaced</summary>${await analysisBlock(a.supersedes, s.analyses[a.supersedes], [], false)}</details>` : ""}</div>`;
}

/* The generated Results section, with the AI beside every result */
const posOf = (a) => a.standard ? [0, a.standard === "data_quality" ? 0 : 1]
  : a.basis === "post hoc" ? [6, a.order_seq ?? a.seq] : [2 + (KIND_RANK[a.kind] ?? 3), a.order_seq ?? a.seq];
const byPos = (x, y) => { const a = posOf(x[1]), b = posOf(y[1]); return a[0] - b[0] || a[1] - b[1]; };
const currentList = () => Object.entries(S.state.analyses).filter(([, a]) => a.status === "ok" && !a.superseded_by && !a.withdrawn).sort(byPos);
async function rtext(id, a, tables, canRun) {
  const d = a.description;
  if (!d) return canRun ? `<p class="small muted">Text not written yet. <button class="linkish" data-agent="describe" data-args='${esc(JSON.stringify({ analysis_id: id }))}' data-label="The Writing Agent is writing">Write it</button></p>` : "";
  const text = resolveRefs(await blob(d.text_sha256) || "", id, tables);
  const ce = canRun ? ` contenteditable="true" spellcheck="true" data-desc="${esc(id)}"` : "";
  const edited = editorsOf(id);
  return `<div class="rtext"${ce}>${text.split(/\n{2,}/).map((p) => `<p>${inlineMd(p, [], false)}</p>`).join("")}</div>
    ${canRun ? `<div class="editbar" id="eb-${esc(id)}" hidden><button class="btn" data-action="savedesc" data-id="${esc(id)}" data-label="Saving">Save my changes</button>
      <button class="btn quiet" data-action="canceldesc">Cancel</button><span class="small muted">Saved under your name; its numbers are checked again.</span></div>` : ""}
    ${edited.length ? `<p class="byline">Wording edited by ${esc(edited.join(", "))}.</p>` : ""}
    ${d.checks?.ok ? "" : `<p class="small"><span class="tag attn">${esc(d.checks?.untraced || 0)} number(s) in this text are not in the results</span></p>`}`;
}
function changesHtml() {
  const types = new Set(["analysis.completed", "analysis.described", "analysis.withdrawn", "analyses.accepted"]);
  const rows = S.events.filter((e) => types.has(e.type)).slice().reverse();
  if (!rows.length) return "";
  return `<details class="alldetails"><summary>Who did what to these results (${rows.length})</summary>
    <ul class="small">${rows.map((e) => `<li>${fmtTime(e.ts)}: ${describe(e)}</li>`).join("")}</ul></details>`;
}
function editorsOf(id) {
  return [...new Set(S.events.filter((e) => e.type === "analysis.described" && e.payload.analysis_id === id && e.payload.edited_by_author).map((e) => name(e.actor_id)))];
}
function unresolveRefs(text, id, tables) {
  const t = tables.find((x) => x.analysis_id === id);
  let out = text;
  if (t?.number) out = out.replace(new RegExp(`\\bTable ${t.number}\\b`, "g"), "[[Table]]");
  for (const f of S.state.figures) if (f.analysis_id === id && f.number) out = out.replace(new RegExp(`\\bFigure ${f.number}\\b`, "g"), `[[Figure:${f.name}]]`);
  return out;
}
function chatBox(id, canRun) {
  if (!canRun) return "";

function renderManuscript(text, marks = []) {
  const inline = (t) => {
    let h = esc(t);
    for (const m of marks) {
      const q = esc(m.quote);
      if (q.length >= 12 && h.includes(q)) h = h.replace(q, `<mark data-point="${esc(m.id)}" title="${esc(m.id)}">${q}</mark>`);
    }
    return h.replace(/\[A:([A-Za-z0-9_.\-]+)\]/g, '<span class="cite" title="Computed result">$1</span>')
      .replace(/\[Authors?:([^\]]+)\]/g, '<span class="placeholder">[Authors:$1]</span>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  };
  return text.split(/\n{2,}/).map((block) => {
    const lines = block.split("\n");
    let out = "", para = [];
    const flush = () => { if (para.length) { out += `<p>${inline(para.join(" "))}</p>`; para = []; } };
    for (const ln of lines) {
      const h = ln.match(/^(#{1,4})\s+(.*)$/);
      if (h) { flush(); out += `<h${Math.min(h[1].length + 1, 4)}>${inline(h[2])}</h${Math.min(h[1].length + 1, 4)}>`; }
      else if (/^\s*[-*]\s+/.test(ln)) { flush(); out += `<ul><li>${inline(ln.replace(/^\s*[-*]\s+/, ""))}</li></ul>`; }
      else para.push(ln);
    }
    flush();
    return out;
  }).join("");
}

/* The manuscript as a canvas: Results with its tables and figures in place, editable in place */
function parseBlocks(text) {
  const blocks = [];
  for (const chunk of (text || "").split(/\n{2,}/)) {
    let para = [];
    const flush = () => { if (para.length) { blocks.push({ type: "p", md: para.join(" ").trim() }); para = []; } };
    for (const ln of chunk.split("\n")) {
      const h = ln.match(/^(#{1,4})\s+(.*)$/);
      if (h) { flush(); blocks.push({ type: "h", level: h[1].length, md: ln.trim(), text: h[2].trim() }); }
      else if (/^\s*[-*]\s+/.test(ln)) { flush(); blocks.push({ type: "li", md: ln.replace(/^\s*[-*]\s+/, "").trim() }); }
      else if (ln.trim()) para.push(ln.trim());
    }
    flush();
  }
  return blocks;
}
const blocksText = (blocks) => blocks.filter((b) => b.type === "h" || b.md).map((b) => b.type === "h" ? b.md : b.type === "li" ? "- " + b.md : b.md).join("\n\n");
function inlineMd(t, marks, editing) {
  let h = esc(t);
  if (!editing) for (const m of marks) {
    const q = esc(m.quote);
    if (q.length >= 12 && h.includes(q)) h = h.replace(q, `<mark data-point="${esc(m.id)}" title="${esc(m.id)}">${q}</mark>`);
  }
  return h.replace(/\[A:([A-Za-z0-9_.\-]+)\]/g, (_, r) => `<span class="cite" contenteditable="false" data-ref="${r}" title="Computed result: ${r}">${r}</span>`)
    .replace(/\[Authors?:([^\]]+)\]/g, '<span class="placeholder">[Authors:$1]</span>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function refsIn(t) {
  const out = { table: [], figure: [] };
  for (const m of t.matchAll(/\b(Tables?|Fig(?:ure)?s?\.?)\s+(\d+(?:\s*(?:,|and|to|-|–)\s*\d+)*)/gi)) {
    const kind = /^tab/i.test(m[1]) ? "table" : "figure", nums = (m[2].match(/\d+/g) || []).map(Number);
    for (const [, a, b] of m[2].matchAll(/(\d+)\s*(?:to|-|–)\s*(\d+)/g)) for (let i = +a; i <= +b; i++) nums.push(i);
    out[kind].push(...nums);

  const tmap = new Map(tables.map((t) => [t.number, t])), fmap = new Map(figures.map((f) => [f.number, f]));
  const objects = async (refs) => {

    for (const n of [...new Set(refs.table)].sort((a, b) => a - b)) if (tmap.has(n) && !placed.table.has(n)) { placed.table.add(n); h += pubTableHtml(tmap.get(n), { editable: editing }); }
    for (const n of [...new Set(refs.figure)].sort((a, b) => a - b)) if (fmap.has(n) && !placed.figure.has(n)) { placed.figure.add(n); h += await figureHtml(fmap.get(n)); }
    return h;

    const t = tables.filter((x) => !placed.table.has(x.number)), f = figures.filter((x) => !placed.figure.has(x.number));
    if (!t.length && !f.length) return "";

    out += b.type === "li" ? `<ul><li class="blk" data-k="li"${ce}>${inlineMd(b.md, marks, editing)}</li></ul>`
                           : `<p class="blk" data-k="p"${ce}>${inlineMd(b.md, marks, editing)}</p>`;

function serialiseBlock(el) {
  const walk = (n) => {
    if (n.nodeType === 3) return n.nodeValue.replace(/ /g, " ");
    if (n.nodeType !== 1) return "";
    if (n.classList.contains("cite")) return `[A:${n.dataset.ref}]`;
    if (n.tagName === "BR") return "\n\n";
    const inner = [...n.childNodes].map(walk).join("");
    if (n.tagName === "STRONG" || n.tagName === "B") return inner.trim() ? `**${inner}**` : "";
    return ["DIV", "P"].includes(n.tagName) ? "\n\n" + inner : inner;
  };
  return [...el.childNodes].map(walk).join("").split(/\n{2,}/).map((x) => x.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n\n");
}

function canvasTableEdits(base) {
  const edits = {};
  for (const box of document.querySelectorAll("#ms .pubtable[data-aid]")) {
    const t = base.find((x) => x.analysis_id === box.dataset.aid);
    if (!t) continue;
    const e = {};
    for (const el of box.querySelectorAll("[data-te]")) {
      const [k, i] = el.dataset.te.split(":"), now = el.innerText.replace(/ /g, " ").trim();
      const orig = k === "title" ? t.title : k === "col" ? t.columns[+i] : k === "row" ? t.rows[+i].cells[0] : t.footnotes[+i];
      const same = (a, b) => a.replace(/\s+/g, " ").trim() === b.replace(/\s+/g, " ").trim();
      if (same(now, orig)) continue;
      if (k === "title") e.title = now;
      else ((e[{ col: "columns", row: "rows", note: "footnotes" }[k]] ||= {})[i] = now);
    }
    if (Object.keys(e).length) edits[t.analysis_id] = e;
  }
  return edits;
}
async function checklistHtml(d, v, canRun) {
  const design = S.state.plan_locked?.report?.design || "other", g = GUIDELINE[design];
  const c = d.checklist;
  const run = canRun ? `<button class="${c ? "linkish" : "btn"}" data-agent="checklist" data-args='${esc(JSON.stringify({ version: v }))}' data-label="Checking against ${esc(g)}">${c ? "Check again" : `Check this version against ${esc(g)}`}</button>` : "";
  if (!c) return `<section><h2>Reporting checklist</h2><p class="small">The paper follows the <strong>${esc(g)}</strong> guideline for a ${esc((DESIGN_NAMES[design] || "").toLowerCase())}. ${run}</p></section>`;
  const items = await blobJSON(c.items_sha256) || [];
  const mark = { reported: ["good", "reported"], partly: ["attn", "partly"], missing: ["bad", "missing"], not_applicable: ["", "not applicable"] };
  return `<section><h2>Reporting checklist: ${esc(c.guideline)}</h2>
    <p class="small">${esc(c.summary.reported)} reported, ${esc(c.summary.partly)} partly, ${esc(c.summary.missing)} missing. Quotations are checked against this version by code; "[Authors]" marks what only you can supply. ${run}</p>
    <details ${c.summary.missing + c.summary.partly ? "open" : ""}><summary>The items</summary><div class="tablewrap"><table><thead><tr><th>Item</th><th>Status</th><th>Where, or what is needed</th></tr></thead><tbody>
    ${items.map((x) => `<tr><td><span class="muted small">${esc(x.id)}</span> ${esc(x.item)}</td><td><span class="tag ${mark[x.status][0]}">${mark[x.status][1]}</span></td>
      <td class="small">${x.quote ? `“${esc(x.quote)}”` : ""}${x.note ? ` ${esc(x.note)}` : ""}</td></tr>`).join("")}</tbody></table></div></details></section>`;
}

async function draftTables(v) {
  const key = `${S.state.head_seq}|${v}`;
  if (S.dtables?.key !== key || S.dtables?.pid !== S.pid) {
    let list = [];
    try { list = (await api(`/projects/${S.pid}/tables?version=${v}`)).tables || []; } catch { /* none */ }
    S.dtables = { key, pid: S.pid, list: list.filter((t) => t.number) };     // a table identical to an earlier one is not repeated
  }
  return S.dtables.list;
}

  }
  const v = S.version || s.draft_version, d = s.drafts[v];

    <div class="msg ${checks.ok ? "ok" : "warn"}"><strong>${checks.ok ? "Number check passed." : "Number check found problems."}</strong>
      ${esc(checks.numbers_checked)} numbers checked against the computed results${checks.untraced ? `; ${checks.untraced} could not be traced` : ""}${checks.exploratory_not_labelled ? `; ${checks.exploratory_not_labelled} exploratory result${checks.exploratory_not_labelled > 1 ? "s" : ""} not called exploratory` : ""}${checks.analyses_not_reported?.length ? `; not reported: ${esc(checks.analyses_not_reported.join(", "))}` : ""}${checks.unknown_analysis_refs?.length ? `; unknown analyses cited: ${esc(checks.unknown_analysis_refs.join(", "))}` : ""}${checks.shortfall_not_reported?.length ? `; sample shortfall not stated for: ${esc(checks.shortfall_not_reported.join(", "))}` : ""}${checks.departure_not_disclosed?.length ? `; departure from the protocol not disclosed for: ${esc(checks.departure_not_disclosed.join(", "))}` : ""}.</div>
    ${full?.untraced?.length ? `<details open><summary>Numbers that could not be traced</summary><ul class="small">${full.untraced.map((u) => `<li><mark>${esc(u.number)}</mark> in: ${esc(u.sentence)}</li>`).join("")}</ul></details>` : ""}
    ${full?.exploratory_not_labelled?.length ? `<details open><summary>Exploratory results not called exploratory</summary><ul class="small">${full.exploratory_not_labelled.map((u) => `<li>${esc(u.sentence)}</li>`).join("")}</ul></details>` : ""}
    ${attempts.length > 1 ? `<p class="small muted">The Writing Agent's first attempt failed the check; it rewrote the draft once from the findings${attempts.at(-1).passed_check ? " and passed" : ", and what remains is for the authors"}.</p>` : ""}
    ${marks.length && !editing ? `<p class="small muted">Highlighted: passages the Reviewer Assistant asked about.</p>` : ""}
    ${checks.tables_not_referred?.length || checks.figures_not_referred?.length || checks.references_unknown?.length ? `<p class="msg warn small">${[
      checks.tables_not_referred?.length ? `Not referred to in the text: ${checks.tables_not_referred.map((n) => "Table " + n).join(", ")}` : "",

    ${canEdit && !editing ? `<div class="bigaction"><p><strong>Edit on the page.</strong> Click any paragraph to change its words. In the tables you can reword the title, headings, row labels and footnotes; the numbers are locked, because they come from the results. Saving makes version ${v + 1}, recorded under your name and checked again.</p>

  </section>

    ${Object.keys(signed).length ? `<ul>${Object.entries(signed).map(([a, x]) => `<li>${esc(name(a))}, ${fmtTime(x.ts)}: “${esc(x.claim_restatement)}”${x.checks_at_signoff ? ` <span class="tag ${x.checks_at_signoff.ok ? "good" : "attn"}">number check ${x.checks_at_signoff.ok ? "passed" : "had problems"} when signed</span>` : ""}</li>`).join("")}</ul>` : "<p>No sign-offs yet.</p>"}

      <label><span>The primary claim, in your own words (at least 8 words)</span><textarea name="claim" required></textarea></label>
      ${s.signoff_questions.map((q, i) => `<label><span>${esc(q)}</span><textarea name="q${i}" required></textarea></label>`).join("")}
      <div><button class="btn" data-label="Signing off">Sign off version ${v}</button></div></form>` : ""}
  </section>
  ${canEdit && !editing ? `<section><details><summary>Edit the text as plain text (Markdown) instead</summary><p class="small muted">For larger rewrites. Your edit becomes version ${v + 1}, is recorded under your name, and is number-checked again. Sign-offs are needed again for the new version.</p>
    <form class="stack" data-form="edit" style="max-width:none"><textarea class="manuscript" name="text">${esc(text)}</textarea>
      <label><span>What you changed and why</span><input type="text" name="summary" required></label>

const okFigures = () => S.state.figures.filter((f) => f.number && S.state.analyses[f.analysis_id]?.status === "ok").sort((a, b) => a.number - b.number);
async function maybeOpenDraft() {
  const s = S.state, v = s.draft_version;
  if (!v || S.version !== v || S.busy || !(isAuthor() || isReviewer())) return;
  if (s.opened[`${S.you}|${v}`]) return;
  try { await command("open_draft", { version: v }); await load(); $(".rail").innerHTML = rail(); } catch { /* not allowed now: fine */ }
}

    </section>
    ${s.stage === "ATTESTATION" || s.stage === "FINAL" ? `<section><h2>Attestation of version ${v}</h2>
      ${Object.keys(att).length ? `<ul>${Object.entries(att).map(([a, x]) => `<li>${esc(name(a))}, ${fmtTime(x.ts)}: “${esc(x.statement)}”</li>`).join("")}</ul>` : ""}
      ${isAuthor() && s.stage === "ATTESTATION" && !att[S.you] ? `<form class="stack" data-form="attest"><label><span>Your attestation, in your own words</span><textarea name="statement" required placeholder="I have read the final version and stand behind it."></textarea></label>

/* Record */
function record() {
  const led = S.ledger || {};
  const calls = S.events.filter((e) => e.type === "llm.called");
  const rows = Object.entries(led).map(([id, r]) => `<tr><td>${esc(name(id))}</td><td class="small">${esc(Object.entries(r.counts).map(([k, n]) => `${k.replaceAll("_", " ")} ${n}`).join(", "))}</td>
    <td class="num">${r.words_added || ""}${r.words_removed ? " / −" + r.words_removed : ""}</td><td class="num">${r.verification_seconds ? Math.round(r.verification_seconds / 60) + " min" : ""}</td>
    <td class="num">${r.tokens || ""}</td><td class="small">${esc(Object.entries(r.on_behalf_of || {}).map(([k, n]) => `${name(k)} ${n}`).join(", "))}</td></tr>`).join("");
  return `<section><h2>Contribution Ledger</h2><p class="small muted">Built from the record alone. Descriptive, not a ranking.</p>
    <div class="tablewrap"><table><thead><tr><th>Who</th><th>What</th><th>Words added / removed</th><th>Time verifying</th><th>Tokens</th><th>Acted for</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section><h2>Model calls (${calls.length})</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>Agent</th><th>Model</th><th>Purpose</th><th>Tokens in / out</th><th>Seconds</th></tr></thead><tbody>
    ${calls.map((e) => `<tr><td>${e.seq}</td><td>${esc(name(e.actor_id))}</td><td>${esc(e.payload.model)}${e.payload.open_weights ? ' <span class="tag">open weights</span>' : ""}</td><td>${esc(e.payload.purpose)}</td>
      <td class="num">${e.payload.prompt_tokens ?? ""} / ${e.payload.completion_tokens ?? ""}</td><td class="num">${e.payload.latency_ms != null ? (e.payload.latency_ms / 1000).toFixed(1) : ""}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted">The exact request and response of every call are stored by hash.</p></section>
  <section><h2>Check it yourself</h2><p>The record is a chain: each event contains the hash of the one before. Anyone can check it at <a href="/projects/${esc(S.pid)}/verify">/projects/${esc(S.pid)}/verify</a>, without a token.</p>
    <button class="btn quiet" data-action="download">Download the full record (JSON)</button></section>`;
}

      <button class="btn" data-action="resume" data-i="${i}">Open</button><button class="btn quiet" data-action="forget" data-i="${i}">Forget</button></li>`).join("")}</ul></div>` : ""}
    <div class="sheet"><h2>${ids.length ? "Open another project" : "Open your project"}</h2><form class="stack" data-form="signin">
      <label><span>Your personal token</span><input type="password" name="token" required autocomplete="off" placeholder="sk_saksi_…"></label>
      <p class="small muted">Saksi gives each person a token when they join a project. If you were invited, the corresponding author sent it to you.</p>
      <label class="inline"><input type="checkbox" name="remember" checked> Remember me on this device</label>
      <div><button class="btn" data-label="Opening">Open</button></div></form></div>
    <details class="sheet"><summary>Start a new project</summary><form class="stack" data-form="create" style="margin-top:1rem">
      <p class="small muted">You become the corresponding author and can then invite co-authors and a reviewer.</p>
      <label><span>Study title</span><input type="text" name="title" required></label>
      <label><span>Your full name</span><input type="text" name="name" required autocomplete="name"></label>
      <label><span>Your ORCID iD (optional)</span><input type="text" name="orcid" placeholder="0000-0000-0000-0000"></label>
      <label><span>Your affiliation (optional)</span><input type="text" name="affiliation" autocomplete="organization"></label>
      <label><span>Creation token</span><input type="password" name="create" autocomplete="off"></label>
      <p class="small muted">Only the people who run this Saksi server can start projects. They set this token; ask them for it.</p>
      <div><button class="btn" data-label="Starting">Start project</button></div></form></details>
    <p class="small muted">Saksi is open source under AGPL-3.0: <a href="https://github.com/boonhowchew/saksi" rel="noreferrer">source code</a>.</p></div>`;
}

async function openProject(pid, token, remember) {
  S.pid = pid; S.token = token; S.blobs = new Map(); S.ledger = null; S.secret = null; S.prefill = null;
  await load();
  const a = S.state.actors[S.you];
  if (remember) {
    const list = store.get().filter((x) => !(x.pid === pid && x.actor === S.you));
    list.push({ pid, token, actor: S.you, name: a.name, roles: a.roles, title: S.state.title });
    store.set(list);
  }
  S.tab = nextStep()[1];
  S.seenSeq = 0;
}

/* ---------- events ---------- */
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-tab],[data-action],[data-agent],mark[data-point]");
  if (!t) return;
  if (t.matches("mark[data-point]")) { S.tab = "review"; await render(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.notice = null; await render(); $("#panel")?.focus?.(); return; }
  if (t.dataset.agent) {
    const label = t.dataset.label;
    await act(t, () => agent(t.dataset.agent, t.dataset.args ? JSON.parse(t.dataset.args) : {}), "Done. The result is below and in the record.",
      `${label}. This can take a minute or two; the page updates when it is done.`);
    if (t.dataset.agent === "write_draft" && S.state.draft_version) document.querySelector("[data-agent=checklist]")?.click();
    return;
  }
  const a = t.dataset.action, s = S.state;
  switch (a) {
    case "signout": S.pid = S.token = S.state = null; S.notice = S.secret = null; return render();
    case "reload": return refresh();
    case "resume": { const x = store.get()[+t.dataset.i]; try { await openProject(x.pid, x.token, true); } catch (e) { S.pid = null; S.state = null; S.notice = { kind: "err", text: e.message }; } return render(); }
    case "forget": { const list = store.get(); list.splice(+t.dataset.i, 1); store.set(list); return render(); }
    case "confirm_plan": return act(t, () => command("confirm_plan", { plan_sha256: s.plan.sha }), "You confirmed the plan.");
    case "runall": {
      return act(t, async () => {
        // Saksi completes what the plan requires: anything that failed is tried again, learning from the failure.
        for (let round = 1; round <= 2; round++) {
          if (round > 1) S.state = (await api(`/projects/${S.pid}`)).state;
          const queue = pendingSteps();
          if (!queue.length) break;
          for (const [i, q] of queue.entries()) {
            S.notice = { kind: "warn", text: `${round > 1 ? "Trying again, learning from the failure: " : ""}${i + 1} of ${queue.length}: ${q.label}. Each step takes up to a minute or two.` };
            const box = $("#status"); if (box) box.innerHTML = noticeHtml();
            try { await agent("run_planned", q.args); } catch { /* recorded; tried again next round */ }
          }
        }
        S.state = (await api(`/projects/${S.pid}`)).state;
        await describeMissing(S.state);
        const left = pendingSteps();
        if (left.length) throw new Error(`Still not complete after a second attempt: ${left.map((q) => q.label).join("; ")}. Each failure and its reason is under "How each result was produced". Tell Saksi AI what to change, or ask the Analysis Agent to redraft that part of the plan.`);
      }, "All the planned analyses ran, in the standard order, each with its text. Check them, then accept the results.");
    }
    case "accept": {
      await act(t, () => command("accept_analyses", { analysis_set_sha256: s.analysis_set_sha256 }),
        s.authors.length > 1 ? "You accepted the results." : "You accepted the results.");
      // When every author has accepted, Saksi goes on to write the draft.
      if (S.state.stage === "DRAFTING" && isAuthor()) {
        S.tab = "draft"; S.notice = { kind: "ok", text: "Every author accepted the results. Saksi is now writing the draft." };
        await render();
        document.querySelector("[data-agent=write_draft]")?.click();
      } else if (S.state.stage === "ANALYSIS") {
        const waiting = S.state.authors.filter((a) => !S.state.analyses_accepted_by.includes(a));
        if (waiting.length) { S.notice = { kind: "ok", text: `You accepted the results. Waiting for ${waiting.map(name).join(", ")}; the draft starts as soon as they accept.` }; await render(); }
      }
      return;
    }
    case "start_review": return act(t, () => command("start_review"), "The review has started.");
    case "submit_response": return act(t, () => command("submit_response"), "The response went to the reviewer.");
    case "usepoint": {
      const b = await blobJSON(s.briefings.find((x) => x.seq === +t.dataset.seq).briefing_sha256);
      const pt = b.points_of_inquiry.find((p) => p.id === t.dataset.point);
      S.prefill = { seq: +t.dataset.seq, point: pt.id, comment: pt.question, location: pt.quote };
      await render(); $("#additem")?.scrollIntoView({ behavior: "smooth", block: "start" }); $("#additem textarea")?.focus();
      return;
    }
    case "clearprefill": S.prefill = null; return render();
    case "copy": {
      try { await navigator.clipboard.writeText(t.dataset.text); t.textContent = "Copied"; }
      catch { t.textContent = "Select and copy it"; }
      return;
    }
    case "editplan": S.planEdit = true; S.notice = null; await render(); $("#panel")?.scrollIntoView({ block: "start" }); return;
    case "canceledit": S.planEdit = false; return render();
    case "planredraft": {
      const m = S.planChat[+t.dataset.i], instructions = m.pending;
      m.pending = null;
      return act(t, () => agent("propose_plan", { instructions }), "The plan was redrafted as agreed. Check it, then confirm it.",
        "The Analysis Agent is redrafting the plan from the protocol. This can take a minute or two.");
    }
    case "confirmai": {
      const m = S.chat[t.dataset.key][+t.dataset.i], p = m.pending;
      m.pending = null;
      return act(t, async () => { const r = await runProposal(p.action, p.message); m.text += " Done."; return r; }, "Done. The earlier version is kept in the record.",
        "Saksi AI is working on it. This can take a minute or two.");
    }
    case "suggest": {
      const x = S.sugg.list[+t.dataset.i];
      if (x.action.type === "table1") { const f = document.querySelector("form[data-form=t1change]"); f?.scrollIntoView({ block: "center" }); f?.querySelector("textarea")?.focus(); return; }
      return act(t, () => runProposal(x.action, x.title), "Done. The result is below, with its text.", "Saksi is working on it. An analysis can take a minute or two.");
    }
    case "savedesc": {
      const id = t.dataset.id, box = document.querySelector(`[data-desc="${CSS.escape(id)}"]`), head = document.querySelector(`[data-head="${CSS.escape(id)}"]`);
      const tables = await tablesNow();
      const text = unresolveRefs(serialiseBlock(box), id, tables);
      const args = { analysis_id: id, text };
      if (head) args.heading = head.innerText.trim();
      return act(t, () => command("edit_description", args), "Your changes were saved under your name, and the numbers checked again.");
    }
    case "canceldesc": return render();
    case "describeall": return act(t, () => describeMissing(S.state), "Each result now has its text, with its numbers checked.");
    case "canvas": S.canvas = S.version || S.state.draft_version; S.notice = null; await render(); document.querySelector("#ms [contenteditable=true]")?.focus(); return;
    case "canvasoff": S.canvas = null; return render();
    case "openask": { const d = document.querySelector(`details.askai:has(form[data-id="${CSS.escape(t.dataset.id)}"])`); if (d) { d.open = true; d.scrollIntoView({ block: "center" }); d.querySelector("textarea")?.focus(); } return; }
    case "tabledocx": try { await downloadTables(t.dataset.n); } catch (e) { S.notice = { kind: "err", text: e.message }; render(); } return;
    case "showcode": { const box = document.getElementById("code-" + t.dataset.sha); box.innerHTML = `<pre>${esc(await blob(t.dataset.sha))}</pre>`; return; }
    case "download": {
      const url = URL.createObjectURL(new Blob([JSON.stringify(S.events, null, 1)], { type: "application/json" }));
      const link = Object.assign(document.createElement("a"), { href: url, download: `saksi-${S.pid}-record.json` });
      document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); return;
    }
  }
});

document.addEventListener("toggle", (ev) => { if (ev.target.id === "details-all") S.detailsOpen = ev.target.open; }, true);
document.addEventListener("input", (ev) => {
  const el = ev.target.closest?.("[data-desc],[data-head]");
  if (!el) return;
  const id = el.dataset.desc || el.dataset.head, bar = document.getElementById("eb-" + id);
  if (bar) bar.hidden = false;
});
document.addEventListener("paste", (ev) => {
  const el = ev.target.closest?.(".canvas [contenteditable=true], .rtext[contenteditable=true], .rsec h4[contenteditable=true]");
  if (!el) return;
  ev.preventDefault();
  document.execCommand("insertText", false, (ev.clipboardData || window.clipboardData).getData("text/plain"));
});

document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.dataset.change === "version") { S.version = +t.value; return render(); }
  if (t.dataset.inc !== undefined) {
    const box = document.getElementById("why-" + t.dataset.inc);
    if (box) { box.style.display = t.checked ? "none" : ""; if (!t.checked) box.querySelector("input")?.focus(); }
    return;
  }
  if (t.dataset.change === "calls") { S.showCalls = t.checked; $(".rail").innerHTML = rail(); return; }
  if (t.dataset.change === "switch") {
    const x = store.get().find((i) => i.pid === S.pid && i.actor === t.value);
    if (x) { await openProject(x.pid, x.token, true); S.notice = { kind: "ok", text: `You are now acting as ${x.name}.` }; return render(); }
  }
});

document.addEventListener("submit", async (ev) => {
  const f = ev.target; ev.preventDefault();
  const fd = new FormData(f), btn = ev.submitter || f.querySelector("button.btn");
  const val = (k) => (fd.get(k) || "").toString().trim();
  const s = S.state;
  switch (f.dataset.form) {
    case "signin":
      try {
        S.token = null;
        const who = await api("/signin", { method: "POST", body: { token: val("token") } });
        await openProject(who.project_id, val("token"), !!fd.get("remember")); S.notice = null;
      } catch (e) { S.pid = null; S.state = null; S.token = null; S.notice = { kind: "err", text: e.message }; }
      return render();
    case "create": {
      try {
        const creator = { name: val("name") };
        if (val("orcid")) creator.orcid = val("orcid");
        if (val("affiliation")) creator.affiliation = val("affiliation");
        S.token = null;
        const r = await api("/projects", { method: "POST", body: { title: val("title"), creator },
          headers: val("create") ? { "X-Saksi-Create-Token": val("create") } : {} });
        await openProject(r.project_id, r.token, true);
        S.secret = { label: "Your personal token for this project", token: r.token,
          hint: "This browser remembers it. Keep a copy too: it opens this project from any other device. It is shown only once." };
        S.notice = { kind: "ok", text: "Project started. Next: upload the dataset and protocol, and invite your co-authors under People." };
        S.tab = "materials";
      } catch (e) { S.pid = null; S.state = null; S.notice = { kind: "err", text: e.message }; }
      return render();
    }
    case "addperson": {
      const actor = { name: val("name") };
      S.pendingName = actor.name;
      if (val("orcid")) actor.orcid = val("orcid");
      if (val("affiliation")) actor.affiliation = val("affiliation");
      return act(btn, () => command("register_human", { actor, role: val("role") }), `${actor.name} was added.`);
    }
    case "upload": {
      const form = new FormData(); form.append("kind", val("kind")); form.append("file", fd.get("file"));
      if (val("note")) form.append("note", val("note"));
      return act(btn, () => api(`/projects/${S.pid}/materials`, { method: "POST", form }), "Uploaded.");
    }
    case "prepare": return act(btn, () => agent("prepare_plan", val("instructions") ? { instructions: val("instructions") } : {}),
      "The plan is ready. Tick the analyses this paper includes, then confirm it.",
      "The Data Curator is checking the data, then the Analysis Agent will draft the plan. This takes a few minutes; the page updates when it is done.")
      .then(() => { if (S.state?.plan) { S.tab = "plan"; return render(); } });
    case "withdraw": return act(btn, () => command("withdraw_material", { sha256: val("sha"), reason: val("reason") }), "The file was removed. Its name, fingerprint and your reason stay in the record.");
    case "planconfirm": {
      const p = s.plan, changed = [];
      let missing = null;
      const analyses = p.order.map((id) => {
        const a = { ...p.analyses[id] };
        delete a.design; delete a.label; delete a.protocol_quote_verified;
        const inc = !!fd.get(`inc:${id}`), why = val(`why:${id}`), was = a.included !== false;
        if (inc !== was) changed.push(inc ? `put back “${a.title || id}”` : `left out “${a.title || id}” (${why})`);
        if (!inc && !why) missing = a.title || id;
        return { ...a, included: inc, exclusion_reason: inc ? null : why };
      });
      if (missing) { S.notice = { kind: "err", text: `Say why “${missing}” is left out: the draft will report it.` }; $("#status").innerHTML = noticeHtml(); return; }
      if (!changed.length) {
        if (s.plan_confirmed_by.includes(S.you)) { S.notice = { kind: "ok", text: "Nothing changed." }; $("#status").innerHTML = noticeHtml(); return; }
        await act(btn, () => command("confirm_plan", { plan_sha256: p.sha }), "You confirmed the plan.");
        return startGenerating();
      }
      await act(btn, async () => {
        const r = await command("propose_plan", { analyses, protocol_ref: p.protocol_ref, table1: p.table1, report: p.report, note: `Chose the analyses for this paper: ${changed.join("; ")}.` });
        return command("confirm_plan", { plan_sha256: r.state.plan.sha });
      }, `Your choice was saved as a revised plan, and you confirmed it.${s.authors.length > 1 ? " Your co-authors now confirm the new version." : ""}`);
      return startGenerating();
    }
    case "redraft": return act(btn, () => agent("propose_plan", val("instructions") ? { instructions: val("instructions") } : {}),
      "The Analysis Agent drafted a new plan. Check it, then confirm it.", "The Analysis Agent is reading the protocol. This can take a minute or two.");
    case "planedit": {
      const p = s.plan, num = (v) => (v && /^\d+$/.test(v) ? +v : null);
      const analyses = p.order.map((id) => {
        const a = { ...p.analyses[id] }, g = (k) => val(`${k}:${id}`);
        delete a.design; delete a.label; delete a.protocol_quote_verified;
        return { ...a, included: !!fd.get(`inc:${id}`), exclusion_reason: g("why") || null, role: g("role"), kind: g("kind"),
          protocol_quote: g("pq"), primary_quote: g("prq"), primary_reason: g("prr") || null, sample_size_quote: g("ssq"),
          sample_size_target: { n: num(g("n")), events: num(g("ev")) }, method: g("method"), missing_data: g("md") };
      });
      const t1vars = val("t1vars").split(",").map((x) => x.trim()).filter(Boolean);
      const table1 = t1vars.length ? { stratify_by: val("t1by") || null, variables: t1vars } : null;
      const report = { aim: val("aim"), design: val("design"), questions: p.report?.questions || [] };
      return act(btn, async () => { const r = await command("propose_plan", { analyses, protocol_ref: p.protocol_ref, note: val("note"), table1, report }); S.planEdit = false; return r; },
        "Saved as a revised plan. Code re-checked every quotation against the protocol; every author now confirms it.");
    }
    case "askai": {
      const id = f.dataset.id, text = val("text");
      if (fd.get("mode") === "text") return act(btn, () => agent("describe", { analysis_id: id, instruction: text }),
        "The text was rewritten and its numbers checked.", "The Writing Agent is rewriting the text.");
      if (fd.get("mode") === "redo") return act(btn, async () => { const r = await agent("redo", { analysis_id: id, reason: text }); await describeMissing(r.state); return r; },
        "Redone. The new run replaces the earlier one, which is kept in the record; check the results, then accept them.",
        "The Analysis Agent is redoing the analysis in the sandbox. This can take a minute or two.");
      const rid = "q" + (Object.values(s.analyses).filter((a) => a.request_id).length + 1);
      return act(btn, async () => { const r = await agent("run_request", { request_id: rid, prompt: text, based_on: id }); await describeMissing(r.state); return r; },
        "The variant ran. It is labelled exploratory, and the original analysis stays in the paper.",
        "The Analysis Agent is writing and running the variant in the sandbox. This can take a minute or two.");
    }
    case "planchat": {
      const msg = val("message");
      S.planChat = S.planChat || [];
      S.planChat.push({ who: "you", text: msg });
      return act(btn, async () => {
        const r = await agent("plan_assist", { message: msg, history: S.planChat.slice(0, -1) });
        const a = r.assist || {};
        const entry = { who: "ai", text: [a.reply, ...(a.questions || [])].filter(Boolean).join(" ") };
        if (a.redraft) entry.pending = a.redraft;
        S.planChat.push(entry);
        return r;
      }, null, "Saksi is reading the protocol and your answer.");
    }
    case "assist": {
      const key = f.dataset.id || "_", msg = val("message");
      (S.chat[key] ||= []).push({ who: "you", text: msg });
      return act(btn, async () => {
        const r = await agent("assist", f.dataset.id ? { message: msg, analysis_id: f.dataset.id } : { message: msg });
        const p = r.assist || {}, a = p.action || {}, entry = { who: "ai", text: p.reply || "" };
        S.chat[key].push(entry);
        if (["redo", "leave_out"].includes(a.type)) {
          entry.pending = { action: a, message: msg, label: a.type === "redo" ? `redo ${a.analysis_id}` : `leave ${a.analysis_id} out of the paper` };
          return r;
        }
        if (a.type && a.type !== "none") { const r2 = await runProposal(a, msg); entry.text += " Done."; return r2 || r; }
        return r;
      }, null, "Saksi AI is working on it. If it runs an analysis, this can take a minute or two.");
    }
    case "withdrawanalysis": return act(btn, () => command("withdraw_analysis", { analysis_id: f.dataset.id, reason: val("reason") }),
      "Left out of the paper. It stays in the record, with your reason, and the reviewer is told.");
    case "t1change": {
      const vars = val("vars").split(",").map((x) => x.trim()).filter(Boolean);
      return act(btn, async () => { const r = await agent("change_table1", { table1: { stratify_by: val("by") || null, variables: vars }, reason: val("reason") }); await describeMissing(r.state); return r; },
        "Table 1 was built by Saksi's own code. Any earlier version is kept in the record.");
    }
    case "explore": return act(btn, async () => { const r = await agent("run_request", { request_id: val("request_id"), prompt: val("prompt") }); await describeMissing(r.state); return r; }, "The exploratory analysis ran. It is labelled exploratory.",
      "The Analysis Agent is writing and running the code. This can take a minute or two.");
    case "signoff": {
      const answers = {}; s.signoff_questions.forEach((q, i) => (answers[q] = val("q" + i)));
      return act(btn, () => command("sign_off", { version: s.draft_version, claim_restatement: val("claim"), answers }), `You signed off version ${s.draft_version}.`);
    }
    case "canvassave": {
      const base = await tablesNow(), v = s.draft_version;
      const raw = await blob(s.drafts[v].text_sha256);
      let text = canvasText();
      if (text === blocksText(parseBlocks(raw))) text = raw;          // the words did not change: keep the text exactly
      const table_edits = canvasTableEdits(base);
      return act(btn, async () => { const r = await command("edit_draft", { base_version: v, text, summary: val("summary"), table_edits }); S.canvas = null; return r; },
        `Saved as version ${v + 1}. The numbers were checked again; each author now signs off the new version.`);
    }
    case "edit": return act(btn, () => command("edit_draft", { base_version: s.draft_version, text: fd.get("text").toString(), summary: val("summary") }), `Saved as version ${s.draft_version + 1}.`);
    case "additem": {
      const args = { item_id: val("item_id"), comment: val("comment") };
      if (val("location")) args.location = val("location");
      if (val("assisted_by_seq")) { args.assisted_by_seq = +val("assisted_by_seq"); args.from_point = val("from_point") || null; }
      return act(btn, async () => { const r = await command("add_item", args); S.prefill = null; return r; }, `Comment ${args.item_id} added.`);
    }
    case "verdict": return act(btn, () => command("give_verdict", { item_id: f.dataset.item, verdict: val("verdict"), note: val("note") }), "Verdict recorded.");
    case "respond": return act(btn, () => command("respond", { item_id: f.dataset.item, response: val("response"), note: val("note") }), "Response recorded.");
    case "submitreview": return act(btn, () => command("submit_review", { decision: btn.value, summary: val("summary") }), btn.value === "accept" ? "You accepted the manuscript." : "You asked for revision.");
    case "attest": return act(btn, () => command("attest", { version: s.draft_version, statement: val("statement") }), `You attested version ${s.draft_version}.`);
  }
});

/* Others may act at the same time: check quietly, never wipe a half-written form. */
setInterval(async () => {
  if (!S.pid || S.busy || document.hidden) return;
  try {
    const st = await api(`/projects/${S.pid}`);
    if (st.state.head_seq !== S.state.head_seq) {
      S.events = await api(`/projects/${S.pid}/events`);
      S.verify = await api(`/projects/${S.pid}/verify`);
      S.stale = true;
      const r = $(".rail"); if (r) r.innerHTML = rail();
      const box = $("#stale"); if (box) box.innerHTML = staleHtml();
    }
  } catch { /* offline for a moment */ }
}, 20000);

render();
</script>
