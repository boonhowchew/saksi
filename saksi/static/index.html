<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saksi</title>
<meta name="description" content="Research that is witnessed, not reconstructed.">
<style>
:root {
  --paper: #EEF1F4;
  --sheet: #FFFFFF;
  --ink: #1B2A4A;
  --indigo: #23366E;
  --muted: #5B6680;
  --rule: #C9D1DB;
  --verdigris: #2F7D6D;
  --verdigris-wash: #E3F1EE;
  --ochre: #9A6416;
  --ochre-wash: #FBF0DC;
  --danger: #A23B3B;
  --sans: "Avenir Next", Avenir, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
a { color: var(--indigo); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #7F95D1; outline-offset: 2px; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .75em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hash, code, pre { font-family: var(--mono); font-size: .8rem; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--paper); padding: .75rem; border-radius: 4px; max-height: 28rem; overflow: auto; margin: .5rem 0; }
.hidden { display: none !important; }

/* Header */
.top { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; padding: 1rem 1.25rem .5rem; }
.mark { font: 600 1.6rem/1 var(--serif); color: var(--indigo); letter-spacing: .01em; margin: 0; }
.mark small { font: 400 .85rem var(--sans); color: var(--muted); margin-left: .5rem; letter-spacing: 0; }
.top .project { font-weight: 600; flex: 1 1 auto; }
.who { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.who select { max-width: 24rem; }

/* Progress: where the project stands. Not buttons. */
.progress { margin: .25rem 1.25rem 1rem; }
.progress .where { margin: 0 0 .45rem; }
.progress .where strong { color: var(--indigo); }
.progress .where .what { color: var(--muted); font-size: .9rem; }
.progress .bar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.progress .bar span { height: 6px; border-radius: 3px; background: var(--rule); }
.progress .bar span.done { background: var(--verdigris); }
.progress .bar span.now { background: var(--indigo); }
.progress .names { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; font-size: .72rem; color: var(--muted); margin-top: .3rem; }
.progress .names span.now { color: var(--indigo); font-weight: 600; }
@media (max-width: 760px) { .progress .names { display: none; } }
.intro { color: var(--muted); margin: 0 0 1.25rem; max-width: 48rem; }
.inuse { display: grid; gap: .6rem; margin: .5rem 0 1rem; }
.inuse .file { border: 1px solid var(--rule); border-left-width: 4px; border-radius: 6px; padding: .7rem .9rem; display: grid; gap: .35rem; }
.inuse .file.ok { border-left-color: var(--verdigris); }
.inuse .file.missing { border-left-color: #D9B36E; background: var(--ochre-wash); }
.inuse .file .head { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
.inuse .file .kind { font-weight: 600; min-width: 5.5rem; }
.bigaction { border: 1px solid var(--indigo); border-radius: 6px; padding: 1rem 1.1rem; background: #F4F6FC; margin: 1rem 0; }
.bigaction p { margin: 0 0 .6rem; }
table.plantable td { vertical-align: top; }
table.plantable td.inc { width: 2.2rem; text-align: center; padding-top: .55rem; }
table.plantable input[type=checkbox] { width: 1.15rem; height: 1.15rem; }
.ticks { white-space: nowrap; }
.ticks span { display: inline-grid; place-items: center; width: 1.3rem; height: 1.3rem; border-radius: 50%; font-size: .75rem; font-weight: 700; margin-right: .15rem; }
.ticks .y { background: var(--verdigris-wash); color: var(--verdigris); }
.ticks .n { background: var(--ochre-wash); color: var(--ochre); }
label.radio { display: flex; gap: .55rem; align-items: flex-start; }
label.radio input { margin-top: .25rem; }
fieldset.roles { border: 0; padding: 0; margin: 0; display: grid; gap: .5rem; }
.copyrow { display: flex; gap: .5rem; align-items: stretch; flex-wrap: wrap; }
.copyrow .secret { flex: 1 1 18rem; }
.diag { border-top: 1px dashed var(--rule); margin-top: .9rem; padding-top: .6rem; }
.pubtable { margin: .8rem 0 1rem; }
.pubtable .ptitle { margin: 0 0 .35rem; font-size: .92rem; }
table.pub { font-family: var(--serif); font-size: .9rem; font-variant-numeric: tabular-nums; width: 100%; table-layout: auto; }
table.pub th:first-child, table.pub td:first-child { min-width: 13rem; width: 32%; white-space: normal; }
table.pub th.r { white-space: normal; min-width: 6.5rem; max-width: 11rem; line-height: 1.25; }
table.pub th, table.pub td { border: 0; padding: .28rem .6rem; color: var(--ink); }
table.pub th { font-weight: 600; vertical-align: bottom; }
table.pub thead tr { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }
table.pub tbody tr:last-child { border-bottom: 2px solid var(--ink); }
table.pub td.r { text-align: right; white-space: nowrap; }
table.pub th.r { text-align: right; }
table.pub td.ind { padding-left: 1.7rem; }
table.pub sup, .pnotes sup { line-height: 0; font-size: .72em; }
.pubtable .pnotes p { font-size: .78rem; margin: .12rem 0; color: var(--muted); }
.pubtable .ptools { margin: .35rem 0 0; }
details.askai { border: 1px solid var(--indigo); border-radius: 6px; margin: .9rem 0 .2rem; background: #F4F6FB; }
details.askai > summary { padding: .5rem .7rem; font-weight: 600; color: var(--indigo); cursor: pointer; }
details.askai > form { padding: 0 .8rem .8rem; }
.aibadge { display: inline-block; font: 700 .7rem var(--sans); letter-spacing: .04em; color: #fff; background: var(--indigo);
  border-radius: 4px; padding: .08rem .35rem; margin-right: .35rem; vertical-align: .08rem; }
fieldset.choice { border: 0; padding: 0; margin: 0 0 .4rem; display: grid; gap: .45rem; }
fieldset.choice label.inline { align-items: flex-start; gap: .5rem; }
fieldset.choice input { margin-top: .25rem; }
.manuscript-view.results { max-width: 60rem; }
.manuscript-view.results .rtext, .manuscript-view.results h4 { max-width: 46rem; }
.manuscript-view .pubtable .tablewrap { overflow-x: auto; }
.rtext[contenteditable="true"], .rsec h4[contenteditable="true"] { outline: 1px dashed transparent; border-radius: 3px; }
.rtext[contenteditable="true"]:hover, .rsec h4[contenteditable="true"]:hover { outline-color: var(--rule); }
.rtext[contenteditable="true"]:focus, .rsec h4[contenteditable="true"]:focus { outline: 2px solid var(--indigo); background: #FAFBFE; }
.editbar { display: flex; gap: .5rem; align-items: center; margin: .3rem 0; font-family: var(--sans); }
.editbar[hidden] { display: none; }
.byline { font: .76rem var(--sans); color: var(--muted); margin: .1rem 0 .4rem; }
.results h2 { font: 600 1.35rem var(--serif); border-bottom: 1px solid var(--rule); padding-bottom: .3rem; }
.results h3.rgroup { font: 600 1.05rem var(--serif); margin: 1.6rem 0 .2rem; color: var(--muted); }
.rsec { margin: 1rem 0 1.6rem; }
.rsec h4 { font: 600 1.02rem var(--serif); margin: 0 0 .3rem; display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
.rsec .rtext p { margin: .35rem 0; }
.methodsnote { background: #F6F7FA; border: 1px solid var(--rule); border-radius: 6px; padding: .6rem .9rem; }
.methodsnote h3 { margin: 0 0 .3rem; font: 600 1rem var(--serif); }
.chat { margin: .5rem 0 0; font-family: var(--sans); font-size: .88rem; }
.chat .cm { margin: .25rem 0; padding: .35rem .6rem; border-radius: 6px; max-width: 46rem; }
.chat .cm.you { background: #EEF1F7; }
.chat .cm.ai { background: var(--verdigris-wash); }
form.chatform { display: flex; gap: .4rem; align-items: center; margin-top: .35rem; max-width: 46rem; }
form.chatform input { flex: 1; padding: .45rem .6rem; font-size: .9rem; }
form.chatform .btn { padding: .4rem .8rem; }
section.advisor ul.sugg { list-style: none; padding: 0; margin: .4rem 0; }
section.advisor ul.sugg li { border-left: 3px solid var(--ochre); background: var(--ochre-wash); padding: .45rem .7rem; margin: .35rem 0; border-radius: 0 4px 4px 0; font-size: .9rem; }
section.advisor ul.sugg li.note { border-left-color: var(--rule); background: #F6F7FA; }
section.advisor ul.sugg li .btn { margin-left: .4rem; padding: .2rem .6rem; font-size: .82rem; }
.reportbox { border: 1px solid var(--indigo); border-radius: 8px; padding: .4rem 1rem .8rem; background: #F7F8FC; }
.reportbox h2 { margin-top: .4rem; }
details.alldetails > summary { font: 600 1.05rem var(--sans); cursor: pointer; padding: .4rem 0; }
.restext { border-left: 3px solid var(--verdigris); background: var(--verdigris-wash); padding: .5rem .8rem; margin: .6rem 0 .8rem; border-radius: 0 4px 4px 0; }
.restext .manuscript-view { max-width: none; font-size: 1rem; }
.restext .manuscript-view p { margin: .3rem 0; }
.restext > p.small { margin: .1rem 0; }
details.replaced { margin: .8rem 0 0; border-top: 1px dashed var(--rule); padding-top: .4rem; }
details.replaced > summary { color: var(--muted); font-size: .85rem; cursor: pointer; }
details.replaced .item { opacity: .8; }
.diag h4 { margin: 0 0 .4rem; }
ul.flags { margin: .3rem 0 .6rem; padding: .5rem .5rem .5rem 1.6rem; }
table.t1 td:not(:first-child), table.t1 th:not(:first-child) { text-align: right; white-space: nowrap; }
table.t1 tr.cat td:first-child { padding-left: 1.4rem; color: var(--muted); }
h2.step { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
h2.step .who { font: 400 .8rem var(--sans); color: var(--muted); }
ol.howto { padding-left: 1.2rem; margin: 0 0 1.5rem; max-width: 40rem; }
ol.howto li { margin-bottom: .35rem; }

/* Layout */
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1.25rem; padding: 0 1.25rem 2rem; align-items: start; }
@media (max-width: 960px) { .wrap { grid-template-columns: 1fr; } }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.next { padding: 1rem 1.25rem; border-bottom: 1px solid var(--rule); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.next p { margin: 0; flex: 1 1 20rem; }
.next strong { color: var(--indigo); }
nav.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding: 0 .75rem; }
nav.tabs button { border: 0; background: none; padding: .7rem .6rem; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav.tabs button[aria-selected="true"] { color: var(--indigo); border-bottom-color: var(--indigo); font-weight: 600; }
nav.tabs .count { font-size: .75rem; color: var(--muted); margin-left: .2rem; }
.panel { padding: 1.25rem; }
section + section { margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: .4rem; border: 1px solid var(--indigo); background: var(--indigo); color: #fff; border-radius: 4px; padding: .45rem .9rem; cursor: pointer; }
.btn.quiet { background: var(--sheet); color: var(--indigo); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.busy::after { content: ""; width: .8rem; height: .8rem; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn.busy::after { animation: none; } }
.linkish { border: 0; background: none; color: var(--indigo); text-decoration: underline; cursor: pointer; padding: 0; }
form.stack { display: grid; gap: .65rem; max-width: 42rem; }
form + form { margin-top: 1.75rem; }
form.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
label { display: grid; gap: .2rem; font-size: .9rem; }
label > span { color: var(--muted); }
input[type=text], input[type=password], input[type=file], select, textarea { border: 1px solid var(--rule); border-radius: 4px; padding: .45rem .55rem; background: #fff; min-width: 0; }
textarea { min-height: 5rem; resize: vertical; }
textarea.manuscript { min-height: 24rem; font: 1rem/1.6 var(--serif); }
.msg { padding: .6rem .8rem; border-radius: 4px; margin: .5rem 0; }
.msg.err { background: #F7E4E4; color: var(--danger); }
.msg.ok { background: var(--verdigris-wash); color: var(--verdigris); }
.msg.warn { background: var(--ochre-wash); color: var(--ochre); }
.secret { font-family: var(--mono); background: var(--ochre-wash); padding: .6rem .8rem; border-radius: 4px; word-break: break-all; }

/* Status words */
.tag { display: inline-block; font-size: .78rem; padding: .05rem .45rem; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.tag.good { color: var(--verdigris); border-color: var(--verdigris); background: var(--verdigris-wash); }
.tag.attn { color: var(--ochre); border-color: #D9B36E; background: var(--ochre-wash); }
.tag.bad { color: var(--danger); border-color: #D9A0A0; background: #F7E4E4; }
.tag.conf { color: var(--indigo); border-color: var(--indigo); }
.tag.expl { color: var(--ochre); border-color: #D9B36E; }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Items and analyses */
.item { border-left: 3px solid var(--rule); padding: .25rem 0 .25rem .9rem; margin: 1rem 0; }
.item.attn { border-left-color: #D9B36E; }
.item.good { border-left-color: var(--verdigris); }
.item h3 { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: .2rem 1rem; font-size: .88rem; margin: .5rem 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
ul.checks { list-style: none; padding: 0; margin: .5rem 0; }
ul.checks li { display: flex; gap: .6rem; padding: .35rem 0; border-top: 1px solid var(--paper); }
ul.checks li .mark { flex: 0 0 1.3rem; height: 1.3rem; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
ul.checks li.met .mark { background: var(--verdigris-wash); color: var(--verdigris); }
ul.checks li.unmet .mark { background: var(--ochre-wash); color: var(--ochre); }
fieldset.edit { border: 1px solid var(--rule); border-radius: 6px; padding: .75rem 1rem 1rem; display: grid; gap: .6rem; }
fieldset.edit legend { font-weight: 600; padding: 0 .3rem; }
label.inline { display: flex; gap: .4rem; align-items: center; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .6rem; }
blockquote { margin: .4rem 0; padding: .3rem .8rem; border-left: 3px solid var(--rule); font-family: var(--serif); color: var(--ink); }
details > summary { cursor: pointer; color: var(--indigo); margin: .3rem 0; }

/* The manuscript reads as a manuscript */
.manuscript-view { font: 1.05rem/1.7 var(--serif); max-width: 42rem; }
.manuscript-view h2 { font: 600 1.3rem var(--serif); margin-top: 1.4rem; }
.manuscript-view h3 { font: 600 1.1rem var(--serif); margin-top: 1.2rem; }
.cite { font: .72rem var(--sans); color: var(--indigo); background: #E6EBF6; border-radius: 3px; padding: 0 .3rem; white-space: nowrap; vertical-align: .1em; }
.placeholder { font: italic .95rem var(--sans); color: var(--ochre); }
mark { background: #FFE9A8; padding: 0 .1rem; }
.manuscript-view .pubtable, .manuscript-view figure.fig { font-size: 1rem; max-width: none; margin: 1.2rem 0 1.4rem; }
.manuscript-view .pubtable .pnotes p, .manuscript-view .pubtable .ptitle { font-family: var(--sans); }
.canvas [contenteditable="true"] { outline: 1px dashed transparent; border-radius: 3px; transition: outline-color .15s; }
.canvas [contenteditable="true"]:hover { outline-color: var(--rule); }
.canvas [contenteditable="true"]:focus { outline: 2px solid var(--indigo); background: #FAFBFE; }
.canvas table.pub td.locked { color: var(--ink); background: repeating-linear-gradient(135deg, transparent 0 6px, #F2F4F8 6px 7px); cursor: not-allowed; }
.canvas .cite { user-select: none; }
.notref { font: .8rem var(--sans); color: var(--ochre); margin: -.6rem 0 1rem; }
.savebar { position: sticky; bottom: 0; z-index: 5; background: var(--sheet); border-top: 2px solid var(--indigo);
  padding: .7rem 0; margin-top: 1rem; display: flex; gap: .6rem; flex-wrap: wrap; align-items: flex-end; }
.savebar label { flex: 1 1 18rem; }
.edited-note { font: .75rem var(--sans); color: var(--verdigris); }
figure.fig { margin: 1rem 0; max-width: 46rem; }
figure.fig img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
figure.fig figcaption { font-size: .9rem; margin-top: .4rem; }
mark[data-point] { cursor: pointer; }

/* The record rail: the memorable part */
.rail { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); display: flex; flex-direction: column; }
@media (max-width: 960px) { .rail { position: static; max-height: none; } }
.rail h2 { font: 600 1.15rem var(--serif); color: var(--indigo); margin: 0 0 .3rem; }
.seal { padding: .6rem .8rem; border-radius: 6px; font-size: .88rem; margin-bottom: .75rem; }
.seal.good { background: var(--verdigris-wash); color: var(--verdigris); border: 1px solid #A9D3C9; }
.seal.bad { background: #F7E4E4; color: var(--danger); border: 1px solid #D9A0A0; }
.chain { list-style: none; margin: 0; padding: 0 0 0 1.1rem; overflow-y: auto; position: relative; }
.chain::before { content: ""; position: absolute; left: .42rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--rule); }
.chain li { position: relative; padding: 0 0 .85rem .6rem; font-size: .85rem; }
.chain li::before { content: ""; position: absolute; left: -1.02rem; top: .35rem; width: .62rem; height: .62rem; border-radius: 50%; background: var(--indigo); border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--indigo); }
.chain li.agent::before { background: var(--sheet); }
.chain li.system::before { background: var(--rule); box-shadow: 0 0 0 1px var(--rule); width: .5rem; height: .5rem; left: -.96rem; }
.chain li.fresh::before { background: var(--verdigris); box-shadow: 0 0 0 1px var(--verdigris); }
.chain .what { color: var(--ink); }
.chain .meta { color: var(--muted); font-size: .78rem; }
.chain .link { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.chain button.linkish { font-size: .78rem; }

/* Sign-in */
.gate { max-width: 44rem; margin: 2rem auto; padding: 0 1.25rem; }
.gate .lead { font: 1.35rem/1.4 var(--serif); color: var(--indigo); margin: .25rem 0 1.5rem; }
.gate .sheet { padding: 1.25rem; margin-bottom: 1rem; }
.ids { list-style: none; padding: 0; margin: 0; }
.ids li { display: flex; gap: .5rem; align-items: center; padding: .35rem 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.ids li span { flex: 1 1 auto; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
"use strict";
/* Saksi web page. Talks only to the Saksi server it was loaded from.
   Every action goes through the same API as everything else; the server decides
   who may do what and writes it to the record. */

const STAGES = [
  ["INGEST", "Data and plan", "Upload the dataset and protocol; the agents check the data and draft the analysis plan; the authors agree the plan."],
  ["ANALYSIS", "Analysis", "The planned analyses run as code in a locked-down sandbox; every author checks and accepts the results."],
  ["DRAFTING", "First draft", "The Writing Agent drafts Methods, Results and Discussion from the results; code checks every number."],
  ["AUTHOR_REVISION", "Authors revise", "Authors edit the draft and each one signs it off."],
  ["REVIEW", "Peer review", "The reviewer comments, helped by an independent AI assistant."],
  ["RESPONSE", "Authors respond", "Authors answer each comment, revising the draft where needed."],
  ["ATTESTATION", "Final sign-off", "Every author attests the version the reviewer accepted."],
  ["FINAL", "Final", "The manuscript and its complete record are finished."]];
const INTROS = {
  people: "Who is working on this study. Authors check and sign everything; the reviewer reviews once every author has signed off. The AI agents act only when a person asks, and the record names who asked.",
  materials: "The study's files. Saksi stores them privately, checks that it can read them, and never sends a data row to an AI model. This version handles quantitative studies: a dataset and its protocol. A qualitative path (transcripts, coding and themes, with the same record, approvals and quotation checks) is designed but not yet built.",
  plan: "Which of the protocol's analyses this paper reports. The Analysis Agent drafts the plan and code checks it against the protocol. The authors choose and confirm it before any analysis runs.",
  analyses: "The Results section, generated from your data and the confirmed plan: data checks for Methods, Table 1, then each objective in the standard order, each with its text, table and figures. Ask Saksi AI beside any result to change it. How each result was produced is folded away below.",
  draft: "The manuscript. Code checks every number against the results, every edit is recorded, and each author signs off.",
  review: "Peer review: the reviewer's comments, the authors' responses, and the Reviewer Assistant's briefing.",
  record: "Everything that happened, sealed in order: who contributed what, and every AI model call.",
};
const TABS = [["people", "People"], ["materials", "Data"], ["plan", "Plan"], ["analyses", "Analyses"],
  ["draft", "Draft"], ["review", "Review"], ["record", "Record"]];

const S = { pid: null, token: null, you: null, state: null, events: [], verify: null, tab: "people",
  version: null, busy: null, notice: null, secret: null, prefill: null, blobs: new Map(), seenSeq: 0, stale: false, chat: {} };

/* ---------- small helpers ---------- */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (h) => h ? esc(String(h).slice(0, 10)) + "…" : "";
const fmtTime = (ts) => { try { return new Date(ts).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); } catch { return esc(ts); } };
const num = (x, d = 2) => (typeof x === "number" && isFinite(x)) ? x.toFixed(d) : (x == null ? "" : esc(x));
const pval = (p) => typeof p === "number" ? (p < 0.001 ? "< 0.001" : p.toFixed(3)) : "";
const $ = (sel) => document.querySelector(sel);
const me = () => S.state?.actors?.[S.you] || {};
const has = (role) => (me().roles || []).includes(role);
const name = (id) => S.state?.actors?.[id]?.name || id;
const isAuthor = () => has("author");
const isReviewer = () => has("reviewer");
const store = {
  get() { try { return JSON.parse(localStorage.getItem("saksi.identities") || "[]"); } catch { return []; } },
  set(list) { try { localStorage.setItem("saksi.identities", JSON.stringify(list)); } catch { /* private window: works for this visit only */ } },
};

async function api(path, { method = "GET", body, form, headers = {} } = {}) {
  const h = { ...headers };
  if (S.token) h["X-Saksi-Token"] = S.token;
  let payload;
  if (form) payload = form;
  else if (body !== undefined) { h["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, { method, headers: h, body: payload }); }
  catch { throw new Error("The connection dropped. If an agent was working it may still finish; the page checks again shortly."); }
  let data = null;
  try { data = await r.json(); } catch { /* not JSON */ }
  if (!r.ok) {
    const d = data?.detail;
    throw new Error(typeof d === "string" ? d : (d ? JSON.stringify(d) : `The server answered ${r.status}.`));
  }
  return data;
}
const command = (name, args = {}) => api(`/projects/${S.pid}/commands/${name}`, { method: "POST", body: { args } });
const agent = (action, args = {}) => api(`/projects/${S.pid}/agents/${action}`, { method: "POST", body: { args } });
async function blob(sha) {
  if (!sha) return null;
  if (!S.blobs.has(sha)) S.blobs.set(sha, api(`/projects/${S.pid}/blobs/${sha}`).then((r) => r.text));
  return S.blobs.get(sha);
}
async function blobJSON(sha) { const t = await blob(sha); try { return t ? JSON.parse(t) : null; } catch { return null; } }

/* ---------- loading ---------- */
async function load() {
  const [st, ev, vr] = await Promise.all([api(`/projects/${S.pid}`), api(`/projects/${S.pid}/events`),
    api(`/projects/${S.pid}/verify`)]);
  const prevCurrent = S.state?.draft_version;
  S.you = st.you; S.state = st.state; S.events = ev; S.verify = vr; S.stale = false;
  if (S.version == null || !S.state.drafts[S.version] || S.version === prevCurrent) S.version = S.state.draft_version || null;
}

async function refresh() { await load(); await render(); }

async function act(button, fn, okText, workingText) {
  if (S.busy) return;
  S.busy = button?.dataset?.label || "Working";
  S.notice = workingText ? { kind: "warn", text: workingText } : null;
  S.secret = null;
  const st = $("#status"); if (st) st.innerHTML = noticeHtml();
  document.querySelectorAll("button.btn").forEach((b) => (b.disabled = true));
  if (button) { button.classList.add("busy"); }
  const before = S.state?.head_seq || 0;
  try {
    const r = await fn();
    if (r?.token_for_new_actor) S.secret = { label: `Personal token for ${S.pendingName || "the person you added"}`, token: r.token_for_new_actor,
      hint: "Send it to them privately, for example by email. They paste it on the Saksi sign-in page. It is shown only once." };
    S.notice = okText ? { kind: "ok", text: okText } : null;
  } catch (e) {
    S.notice = { kind: "err", text: e.message };
  } finally {
    S.busy = null;
    try { await load(); } catch (e) { S.notice = { kind: "err", text: e.message }; }
    S.seenSeq = before;
    await render();
  }
}

/* ---------- plain-language record ---------- */
function describe(e) {
  const p = e.payload || {}, who = esc(name(e.actor_id));
  const forWhom = p.requested_by ? ` for ${esc(name(p.requested_by))}` : "";
  switch (e.type) {
    case "project.created": return `${who} started the project`;
    case "actor.registered": return p.kind === "agent" ? `${esc(p.name)} joined, running ${esc(p.model)}`
      : `${esc(p.name)} joined as ${esc((p.roles || []).filter((r) => r !== "corresponding_author").join(", ") || "author")}`;
    case "material.uploaded": return `${who} uploaded the ${esc(p.kind.replace("_", " "))}: ${esc(p.filename)}`;
    case "material.withdrawn": return `${who} removed the ${esc(p.kind.replace("_", " "))} ${esc(p.filename)}: ${esc(p.reason)}`;
    case "curator.reported": return `${who} reported on the dataset${forWhom}`;
    case "plan.proposed": { const n = Object.keys(p.analyses || {}).length; return `${who} proposed a plan of ${n} ${n === 1 ? "analysis" : "analyses"}${forWhom}`; }
    case "plan.confirmed": return `${who} confirmed the plan`;
    case "plan.locked": return "The plan was locked: every author confirmed it";
    case "stage.advanced": return `Moved to ${esc(stageName(p.to))}: ${esc(p.reason)}`;
    case "analysis.requested": return `${who} asked for an exploratory analysis`;
    case "analysis.withdrawn": return `${who} left the exploratory analysis ${esc(p.analysis_id)} out of the paper: ${esc(p.reason)}`;
    case "analysis.described": if (p.edited_by_author) return `${who} edited the ${p.section === "methods" ? "Methods" : "Results"} text for ${esc(p.analysis_id)}: numbers ${p.checks?.ok ? "checked" : "with problems"}`;
      return `${who} wrote the ${p.section === "methods" ? "Methods" : "Results"} text for ${esc(p.analysis_id)}${p.requested_by ? " for " + esc(name(p.requested_by)) : ""}: numbers ${p.checks?.ok ? "checked" : "with problems"}`;
    case "analysis.completed": if (p.standard) return `Saksi ran its standard ${p.standard === "table1" ? "Table 1" : "data-quality check"}${forWhom}: ${p.status === "ok" ? "done" : "failed"}`;
      return `${who} ran ${esc(p.analysis_id)} (${esc(labelText(p))}): ${p.status === "ok" ? "done" : "failed"}${forWhom}`;
    case "analyses.accepted": return `${who} accepted the results`;
    case "draft.created": return `${who} wrote draft version ${p.version}${forWhom}`;
    case "draft.edited": return `${who} edited the draft, making version ${p.version}${forWhom}`;
    case "draft.opened": return `${who} opened version ${p.version}`;
    case "draft.signed_off": return `${who} signed off version ${p.version}`;
    case "review.briefing": return `${who} briefed ${esc(name(p.requested_by))}: ${(p.points_of_inquiry || []).length} points`;
    case "review.item_added": return `${who} commented (${esc(p.item_id)})`;
    case "review.item_responded": return `${who} ${esc(p.response)} ${esc(p.item_id)}`;
    case "review.item_verdict": return `${who} marked ${esc(p.item_id)} ${esc(p.verdict.replaceAll("_", " "))}`;
    case "review.submitted": return p.decision === "accept" ? `${who} accepted the manuscript` : `${who} asked for revision`;
    case "response.submitted": return `${who} sent the response to the reviewer`;
    case "authorship.attested": return `${who} attested version ${p.version}`;
    case "llm.called": return `${who} called ${esc(p.model)} (${(p.prompt_tokens || 0) + (p.completion_tokens || 0)} tokens)`;
    default: return esc(e.type);
  }
}
const labelText = (a) => a.downgraded ? "exploratory: sample short of plan" : a.label === "confirmatory" ? `confirmatory${a.primary_basis === "authors" ? ", primary named by the authors" : ""}` : `exploratory${a.basis ? ", " + a.basis : ""}`;
const labelTag = (a) => `<span class="tag ${a.label === "confirmatory" ? "conf" : "expl"}" title="${a.label === "confirmatory" ? "The pre-specified primary analysis the study was designed and powered for" : "Not what the study was designed and powered for"}">${esc(labelText(a))}</span>`;
const stageName = (code) => (STAGES.find(([c]) => c === code) || [code, code])[1];

/* ---------- what should I do next ---------- */
function nextStep() {
  const s = S.state, v = s.draft_version;
  const signed = s.signoffs[v] || {};
  const waiting = (ids) => ids.map(name).join(", ");
  if (s.stage === "FINAL") return ["Final. Every author attested version " + v + ".", "draft"];
  if (isAuthor()) {
    switch (s.stage) {
      case "INGEST": {
        const live = s.materials.filter((m) => !m.withdrawn);
        if (!live.some((m) => m.kind === "dataset") || !live.some((m) => m.kind === "protocol")) return ["Upload the study's dataset and its protocol.", "materials"];
        if (!s.plan || planFromRemovedProtocol()) return ["Click “Check the data and draft the plan”. The agents do the rest; it takes a few minutes.", "plan"];
        if (!s.plan_confirmed_by.includes(S.you)) return ["Tick the analyses this paper includes, then confirm the plan.", "plan"];
        return ["Waiting for co-authors to confirm the plan: " + waiting(s.authors.filter((a) => !s.plan_confirmed_by.includes(a))), "plan"];
      }
      case "ANALYSIS": {
        if (pendingSteps().length) return ["Run the analyses. Saksi runs them in the standard order: data quality, Table 1, descriptive, univariable, multivariable with diagnostics.", "analyses"];
        if (!s.analyses_accepted_by.includes(S.you)) return ["Check the results and accept them. You can also ask for an exploratory analysis.", "analyses"];
        return ["Waiting for co-authors to accept the results: " + waiting(s.authors.filter((a) => !s.analyses_accepted_by.includes(a))), "analyses"];
      }
      case "DRAFTING": return ["Ask the Writing Agent for the first draft.", "draft"];
      case "AUTHOR_REVISION":
        if (!signed[S.you]) return [`Read version ${v}, edit it if needed, and sign it off.`, "draft"];
        if (s.authors.every((a) => signed[a]) && !s.reviewers.length) return [has("corresponding_author") ? "Every author has signed off. Add a reviewer to start the review." : "Every author has signed off. Waiting for a reviewer to be added.", "people"];
        if (s.authors.every((a) => signed[a])) return [has("corresponding_author") ? `Every author has signed off. Send version ${v} for review.` : "Every author has signed off. Waiting for the review to start.", "people"];
        return ["Waiting for co-authors to sign off: " + waiting(s.authors.filter((a) => !signed[a])), "draft"];
      case "REVIEW": return [`The reviewer is reviewing version ${v} (round ${s.round}).`, "review"];
      case "RESPONSE": {
        const open = Object.entries(s.items).filter(([, it]) => it.status === "open");
        if (open.length) return [`Respond to ${open.length} open comment${open.length > 1 ? "s" : ""}. Edit the draft first for any you revise.`, "review"];
        if (!signed[S.you]) return [`Every comment has a response. Sign off version ${v}.`, "draft"];
        if (s.authors.some((a) => !signed[a])) return ["Waiting for co-authors to sign off: " + waiting(s.authors.filter((a) => !signed[a])), "draft"];
        return [has("corresponding_author") ? "Send the response to the reviewer." : "Waiting for the corresponding author to send the response.", "review"];
      }
      case "ATTESTATION":
        if (!(s.attestations[v] || {})[S.you]) return [`The reviewer accepted. Attest version ${v}.`, "review"];
        return ["Waiting for co-authors to attest.", "review"];
    }
  }
  if (isReviewer()) {
    if (s.stage === "REVIEW") {
      const pending = Object.values(s.items).filter((it) => it.status === "responded").length;
      if (pending) return [`Give a verdict on ${pending} response${pending > 1 ? "s" : ""}, then accept or ask for revision.`, "review"];
      const briefed = s.briefings.some((b) => b.round === s.round && b.draft_version === v);
      return [briefed ? "Read the draft, write your comments, then accept or ask for revision."
        : "Read version " + v + ". You can ask the Reviewer Assistant for a briefing first.", "review"];
    }
    return ["Nothing for you yet. The review starts once every author has signed off the draft.", "draft"];
  }
  return ["Nothing for you to do at this stage.", "record"];
}

/* ---------- rendering ---------- */
async function render() {
  const app = $("#app");
  if (!S.pid || !S.state) { app.innerHTML = gate(); return; }
  const [msg, tab] = nextStep();
  const s = S.state;
  const ids = store.get().filter((x) => x.pid === S.pid);
  const stageIdx = STAGES.findIndex(([c]) => c === s.stage);
  app.innerHTML = `
  <header class="top">
    <p class="mark">Saksi<small>witnessed research</small></p>
    <p class="project" title="Project id: ${esc(s.project_id)}">${esc(s.title)}</p>
    <div class="who">
      <label class="small"><span class="hidden">Acting as</span>
        <select data-change="switch" aria-label="Acting as">
          ${ids.map((x) => `<option value="${esc(x.actor)}" ${x.actor === S.you ? "selected" : ""}>${esc(x.name)} (${esc(roleLabel(x.roles))})</option>`).join("")}
          ${ids.some((x) => x.actor === S.you) ? "" : `<option selected>${esc(me().name)}</option>`}
        </select></label>
      <button class="btn quiet" data-action="signout">Sign out</button>
    </div>
  </header>
  <div class="progress" role="group" aria-label="Where this project stands">
    <p class="where"><strong>Stage ${stageIdx + 1} of 8: ${esc(STAGES[stageIdx][1])}${["REVIEW", "RESPONSE"].includes(s.stage) ? `, round ${s.round}` : ""}.</strong> <span class="what">${esc(STAGES[stageIdx][2])}</span></p>
    <div class="bar" aria-hidden="true">${STAGES.map((_, i) => `<span class="${i < stageIdx ? "done" : i === stageIdx ? "now" : ""}"></span>`).join("")}</div>
    <div class="names" aria-hidden="true">${STAGES.map(([, n], i) => `<span class="${i === stageIdx ? "now" : ""}">${esc(n)}</span>`).join("")}</div>
  </div>
  <div class="wrap">
    <main class="sheet">
      <div class="next"><p><strong>${esc(me().name)}</strong>: ${esc(msg)}</p>
        ${S.tab !== tab ? `<button class="btn quiet" data-tab="${tab}">Open ${esc(TABS.find(([t]) => t === tab)[1])}</button>` : ""}</div>
      <div id="stale">${staleHtml()}</div>
      <div id="status" role="status">${noticeHtml()}</div>
      ${S.secret ? secretHtml("margin:1rem 1.25rem 0") : ""}
      <nav class="tabs" role="tablist">${TABS.map(([t, n]) => `<button role="tab" aria-selected="${S.tab === t}" data-tab="${t}">${esc(n)}${tabCount(t)}</button>`).join("")}</nav>
      <div class="panel" id="panel">${await panel(S.tab)}</div>
    </main>
    <aside class="rail" aria-label="Record">${rail()}</aside>
  </div>`;
  if (S.tab === "draft") maybeOpenDraft();
}
const secretHtml = (style = "") => `<div style="${style}"><p class="small"><strong>${esc(S.secret.label)}.</strong> ${esc(S.secret.hint || "It is shown only once.")}</p>
  <div class="copyrow"><div class="secret">${esc(S.secret.token)}</div><button class="btn quiet" data-action="copy" data-text="${esc(S.secret.token)}">Copy</button></div></div>`;
const staleHtml = () => S.stale ? `<div class="msg warn" style="margin:1rem 1.25rem 0">Someone else has acted since this page was drawn. The record on the right is up to date. <button class="linkish" data-action="reload">Show the latest everywhere</button></div>` : "";
const noticeHtml = () => S.notice ? `<div class="msg ${S.notice.kind}" style="margin:1rem 1.25rem 0">${esc(S.notice.text)}</div>` : "";
const roleLabel = (roles = []) => roles.includes("corresponding_author") ? "corresponding author" : (roles[0] || "");
function tabCount(t) {
  const s = S.state;
  if (t === "analyses" && Object.keys(s.analyses).length) return `<span class="count">${Object.keys(s.analyses).length}</span>`;
  if (t === "draft" && s.draft_version) return `<span class="count">v${s.draft_version}</span>`;
  if (t === "review" && Object.keys(s.items).length) return `<span class="count">${Object.keys(s.items).length}</span>`;
  return "";
}

function rail() {
  const v = S.verify;
  const seal = v?.ok
    ? `<div class="seal good"><strong>Record intact.</strong> ${v.events} events, each sealed with the hash of the one before. Any change to any event would show here.</div>`
    : `<div class="seal bad"><strong>Record broken${v?.bad_seq ? " at event " + v.bad_seq : ""}.</strong> ${esc(v?.error || "")}</div>`;
  const shown = [...S.events].reverse().filter((e) => e.type !== "llm.called" || S.showCalls);
  return `<h2>Record</h2>${seal}
    <p class="small muted"><label style="display:flex;gap:.4rem;align-items:center"><input type="checkbox" data-change="calls" ${S.showCalls ? "checked" : ""}> Show model calls</label></p>
    <ol class="chain">${shown.map((e) => {
      const kind = e.actor_id === "system" ? "system" : e.actor_id.startsWith("agent:") ? "agent" : "human";
      const fresh = S.seenSeq && e.seq > S.seenSeq ? " fresh" : "";
      return `<li class="${kind}${fresh}"><div class="what">${describe(e)}</div>
        <div class="meta">#${e.seq}, ${fmtTime(e.ts)}</div>
        <div class="link" title="This event's hash, and the hash of the event before it">${short(e.hash)} ← ${short(e.prev_hash)}</div>
        <details><summary class="small">Exact entry</summary><pre>${esc(JSON.stringify(e.payload, null, 1))}</pre></details></li>`;
    }).join("")}</ol>`;
}

async function panel(tab) {
  try {
    return `<p class="intro">${esc(INTROS[tab] || "")}</p>` + await panelBody(tab);
  } catch (e) { return `<div class="msg err">${esc(e.message)}</div>`; }
}
async function panelBody(tab) {
  {
    switch (tab) {
      case "people": return people();
      case "materials": return await materials();
      case "plan": return plan();
      case "analyses": return await analyses();
      case "draft": return await draft();
      case "review": return await review();
      case "record": S.ledger = await api(`/projects/${S.pid}/ledger`); return record();
    }
  }
  return "";
}

/* People */
const AGENT_JOBS = {
  curator: "Checks the dataset from an aggregate profile and drafts the data dictionary. Never sees a record.",
  analyst: "Drafts the analysis plan from the protocol and writes the analysis code.",
  writer: "Drafts Methods, Results and Discussion from the computed results.",
  reviewer_assist: "Briefs the reviewer. A separate, open-weights model that never sees the authors' side.",
};
function people() {
  const s = S.state, all = Object.entries(s.actors);
  const humans = all.filter(([, a]) => a.kind !== "agent");
  const authors = humans.filter(([, a]) => (a.roles || []).includes("author"));
  const reviewers = humans.filter(([, a]) => (a.roles || []).includes("reviewer"));
  const agentsList = all.filter(([, a]) => a.kind === "agent");
  const orcid = (a) => a.orcid ? `<a href="https://orcid.org/${esc(a.orcid)}" rel="noreferrer" target="_blank">${esc(a.orcid)}</a>` : "";
  const row = ([id, a], role) => `<tr><td>${esc(a.name)}${id === S.you ? ' <span class="tag">you</span>' : ""}</td><td>${role}</td><td>${esc(a.affiliation || "")}</td><td>${orcid(a)}</td></tr>`;
  const canAdd = has("corresponding_author") && s.stage !== "FINAL";
  const authorsOpen = ["INGEST", "ANALYSIS"].includes(s.stage);
  const allSigned = s.authors.every((a) => (s.signoffs[s.draft_version] || {})[a]);
  return `<section><h2>Authors</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Affiliation</th><th>ORCID iD</th></tr></thead><tbody>
      ${authors.map((x) => row(x, (x[1].roles || []).includes("corresponding_author") ? "Corresponding author" : "Co-author")).join("")}</tbody></table></div></section>
    <section><h2>Reviewer</h2>${reviewers.length
      ? `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Affiliation</th><th>ORCID iD</th></tr></thead><tbody>${reviewers.map((x) => row(x, "Reviewer")).join("")}</tbody></table></div>`
      : `<p>No reviewer yet. A reviewer can be added at any stage; the review starts once every author has signed off the draft.</p>`}</section>
    <section><h2>AI agents</h2><p class="small muted">They act only when a person asks. Every call, with the exact request and reply, is in the record.</p>
      <div class="tablewrap"><table><thead><tr><th>Agent</th><th>What it does</th><th>Model</th></tr></thead><tbody>
      ${agentsList.map(([, a]) => `<tr><td>${esc(a.name)}</td><td>${esc(AGENT_JOBS[(a.roles || [])[0]] || "")}</td><td>${esc(a.model)} <span class="muted small">via ${esc(a.provider)}</span></td></tr>`).join("")}</tbody></table></div></section>
    ${canAdd ? `<section><h2>Invite a co-author or a reviewer</h2>
      <form class="stack" data-form="addperson">
        <label><span>Full name</span><input type="text" name="name" required autocomplete="off"></label>
        <fieldset class="roles"><legend class="small muted">Role</legend>
          ${authorsOpen ? `<label class="radio"><input type="radio" name="role" value="author" checked><span><strong>Co-author.</strong> Confirms the plan, accepts the results, edits and signs the manuscript.</span></label>`
            : `<p class="small muted">Co-authors can only join before drafting starts, so that every author can check the analysis.</p>`}
          <label class="radio"><input type="radio" name="role" value="reviewer" ${authorsOpen ? "" : "checked"}><span><strong>Reviewer.</strong> Reviews the manuscript once every author has signed it off. Independent of the authors.</span></label>
        </fieldset>
        <label><span>ORCID iD (optional)</span><input type="text" name="orcid" placeholder="0000-0000-0000-0000"></label>
        <label><span>Affiliation (optional)</span><input type="text" name="affiliation"></label>
        <div><button class="btn" data-label="Adding">Add and show their token</button></div>
        <p class="small muted">Saksi then shows a personal token for them, once. Send it to them privately, for example by email. They paste it on the Saksi sign-in page to join.</p>
      </form></section>` : ""}
    ${has("corresponding_author") && s.stage === "AUTHOR_REVISION" && s.reviewers.length && allSigned
      ? `<section><h2>Start the review</h2><button class="btn" data-action="start_review" data-label="Starting">Send version ${s.draft_version} for review</button></section>` : ""}`;
}

/* Data */
function prepareBox(again) {
  return `<div class="bigaction"><p><strong>${again ? "Draft the plan again" : "Next: let the agents prepare the analysis plan."}</strong>
    The Data Curator checks the dataset (from summaries only, never rows), then the Analysis Agent reads the protocol and drafts the plan. Saksi checks every quotation against the protocol. This takes a few minutes.</p>
    <form class="stack" data-form="prepare" style="max-width:none">
      <details><summary class="small">Add instructions for the agent (optional)</summary>
        <label style="margin-top:.5rem"><span>For example: “only the analyses for objective 1”</span><textarea name="instructions"></textarea></label></details>
      <div><button class="btn" data-label="The agents are preparing the plan">Check the data and draft the plan</button></div></form></div>`;
}
function planFromRemovedProtocol() {
  const s = S.state;
  return !!(s.plan && s.materials.some((m) => m.sha256 === s.plan.protocol_ref && m.withdrawn)
    && !s.materials.some((m) => m.sha256 === s.plan.protocol_ref && !m.withdrawn));
}
function readText(m) {
  const i = m.inspection;
  if (!i) return `<span class="muted">Not checked: uploaded before Saksi checked files on arrival. Upload it again to see what Saksi reads.</span>`;
  if (i.error) return `<span class="tag bad">Saksi could not read it</span> ${esc(i.error)}`;
  if (m.kind === "dataset") return `<span class="tag good">read</span> ${esc(i.rows)} rows and ${esc(i.columns)} columns`;
  if (i.warning) return `<span class="tag attn">almost no text</span> ${esc(i.warning)}`;
  return i.characters != null ? `<span class="tag good">read</span> ${esc(i.characters.toLocaleString())} characters of text${i.pages ? ` from ${esc(i.pages)} pages` : ""}` : "";
}
function removeControl(m) {
  return `<details class="small"><summary>Remove this file</summary>
    <form class="row" data-form="withdraw" style="margin-top:.4rem"><input type="hidden" name="sha" value="${esc(m.sha256)}">
      <label style="flex:1 1 16rem"><span>Why? (kept in the record)</span><input type="text" name="reason" required placeholder="For example: uploaded the wrong file"></label>
      <button class="btn quiet" data-label="Removing">Remove file</button></form>
    <p class="muted">The stored copy is deleted. The record keeps the file's name and fingerprint, and your reason.</p></details>`;
}
async function materials() {
  const s = S.state, live = s.materials.filter((m) => !m.withdrawn);
  const cur = (kind) => live.filter((m) => m.kind === kind).at(-1);
  const ds = cur("dataset"), pr = cur("protocol");
  const canEdit = isAuthor() && s.stage === "INGEST";
  const card = (label, m, missing) => m ? `<div class="file ${m.inspection && (m.inspection.error || m.inspection.warning) ? "missing" : "ok"}">
      <div class="head"><span class="kind">${label}</span><span>${esc(m.filename)}</span><span class="tag good">in use</span>
        <span class="small muted">uploaded by ${esc(name(m.by))}</span></div>
      <div class="small">${readText(m)}</div>
      ${m.kind === "protocol" && m.inspection?.preview ? `<details class="small"><summary>The start of the text Saksi reads</summary><blockquote>${esc(m.inspection.preview)}…</blockquote>
        <p class="muted">Quotations in the plan are checked against this text. If it looks garbled, upload a Word or text version of the protocol.</p></details>` : ""}
      ${canEdit ? removeControl(m) : ""}</div>`
    : `<div class="file missing"><div class="head"><span class="kind">${label}</span><span>${missing}</span></div></div>`;
  const others = s.materials.filter((m) => m !== ds && m !== pr);
  const status = (m) => m.withdrawn ? `Removed by ${esc(name(m.withdrawn.by))}: ${esc(m.withdrawn.reason)}`
    : ["dataset", "protocol"].includes(m.kind) ? "Not used: a later upload replaced it" : "Supporting document";
  let rep = "";
  const r = ds && s.curator_reports.filter((x) => x.material_sha256 === ds.sha256).at(-1);
  if (r) {
    const full = await blobJSON(r.report_sha256);
    if (full) {
      const sev = { high: "bad", medium: "attn", low: "" };
      rep = `<section><h2>Data Curator's report on ${esc(ds.filename)}</h2>
        <p class="muted small">From an aggregate profile of ${esc(full.profile?.rows)} rows and ${esc(full.columns ?? full.profile?.columns?.length)} columns${(full.prompts || []).length > 1 ? ", checked in batches of columns" : ""}. The Curator never saw a record. Requested by ${esc(name(r.requested_by))}.</p>
        <p>${esc(full.summary)}</p>
        ${full.flags?.length ? `<details ${full.flags.some((f) => f.severity === "high") ? "open" : ""}><summary>${full.flags.length} things for the authors to check${full.flags.some((f) => f.severity === "high") ? ", some important" : ""}</summary><div class="tablewrap"><table><thead><tr><th>Severity</th><th>Column</th><th>Issue</th><th>Suggested check</th></tr></thead><tbody>
          ${full.flags.map((f) => `<tr><td><span class="tag ${sev[f.severity] || ""}">${esc(f.severity)}</span></td><td>${esc(f.column || "")}</td><td>${esc(f.issue)}</td><td>${esc(f.suggested_check)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
        ${full.protocol_variables_missing_from_data?.length ? `<p class="msg warn small">Named in the protocol but not found in the data: ${esc(full.protocol_variables_missing_from_data.join(", "))}</p>` : ""}
        <details><summary>Data dictionary (${(full.dictionary || []).length} columns)</summary><div class="tablewrap"><table><thead><tr><th>Column</th><th>Label</th><th>Type</th><th>Units or coding</th><th>Role</th></tr></thead><tbody>
          ${(full.dictionary || []).map((d) => `<tr><td>${esc(d.column)}</td><td>${esc(d.label)}</td><td>${esc(d.type)}</td><td>${esc(d.units_or_coding)}</td><td>${esc(d.role)}</td></tr>`).join("")}</tbody></table></div></details>
      </section>`;
    }
  }
  return `<section><h2>In use for this study</h2>
    <div class="inuse">${card("Dataset", ds, "Not uploaded yet. Add a CSV or Excel file below.")}${card("Protocol", pr, "Not uploaded yet. Add the protocol (PDF, Word or text) below.")}</div>
    ${ds && pr && canEdit && (!s.plan || planFromRemovedProtocol()) ? prepareBox(false) : ""}
    ${ds && pr && canEdit && s.plan && !planFromRemovedProtocol() ? `<p class="small">The plan has been drafted: see the <button class="linkish" data-tab="plan">Plan</button> tab.</p>` : ""}
  </section>
  ${canEdit ? `<section><h2>Add a file</h2>
    <p class="small muted">A new dataset or protocol replaces the one in use; the earlier file stays listed below, unused, until you remove it.</p>
    <form class="row" data-form="upload">
      <label><span>What it is</span><select name="kind"><option value="dataset">Dataset (CSV or Excel)</option><option value="protocol">Protocol (PDF, Word or text)</option><option value="codebook">Codebook</option><option value="ethics_approval">Ethics approval</option><option value="registration">Trial or study registration</option><option value="other">Other</option></select></label>
      <label><span>File</span><input type="file" name="file" required></label>
      <label><span>Note (optional)</span><input type="text" name="note"></label>
      <button class="btn" data-label="Uploading">Upload</button></form></section>` : ""}
  ${others.length ? `<section><h2>Other files</h2><div class="tablewrap"><table><thead><tr><th>What</th><th>File</th><th>Status</th><th>Read by Saksi</th></tr></thead><tbody>
    ${others.map((m) => `<tr><td>${esc(m.kind.replace("_", " "))}</td><td>${esc(m.filename)}</td><td class="small">${status(m)}${canEdit && !m.withdrawn ? removeControl(m) : ""}</td><td class="small">${m.withdrawn ? "" : readText(m)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
  ${rep}`;
}

/* Plan */
function plan() {
  const s = S.state, p = s.plan;
  const live = s.materials.filter((m) => !m.withdrawn);
  const ready = live.some((m) => m.kind === "dataset") && live.some((m) => m.kind === "protocol");
  const canAct = isAuthor() && s.stage === "INGEST";
  if (!p || planFromRemovedProtocol()) {
    return `<section>${p ? `<p class="msg warn">This plan was drafted from a protocol that has since been removed.</p>` : ""}
      ${!ready ? `<p>First upload the dataset and the protocol on the <button class="linkish" data-tab="materials">Data</button> tab.</p>`
        : canAct ? prepareBox(!!p) : `<p class="muted">An author starts this step.</p>`}</section>`;
  }
  if (S.planEdit && canAct) return planEditor(p);
  const locked = s.plan_locked && s.plan_locked.sha === p.sha;
  const editable = canAct && !locked;
  const items = p.order.map((id) => p.analyses[id]);
  const inc = items.filter((a) => a.included !== false);
  const nConf = inc.filter((a) => a.label === "confirmatory").length;
  const confirmedBy = s.authors.filter((a) => s.plan_confirmed_by.includes(a));
  const ticks = (a) => (a.design?.conditions || []).map((c) => `<span class="${c.met ? "y" : "n"}" title="${esc(c.label)}: ${c.met ? "yes" : "no"}">${c.met ? "✓" : "✗"}</span>`).join("");
  return `${reportBox(p, canAct && !locked)}<section>
    <p><strong>${items.length} ${items.length === 1 ? "analysis" : "analyses"} from the protocol</strong>: ${nConf} can answer the paper's question as planned (confirmatory, if the completed study reaches the sample its protocol planned), ${inc.length - nConf} cannot (exploratory)${items.length - inc.length ? `, ${items.length - inc.length} left out of this paper` : ""}.
      ${p.by.startsWith("agent:") ? `Drafted by the ${esc(name(p.by))}` : `Revised by ${esc(name(p.by))}`}${p.note ? `: ${esc(p.note)}` : "."}</p>
    <p class="small">${p.table1 ? `<strong>Table 1</strong> describes ${esc(p.table1.variables.length)} characteristics${p.table1.stratify_by ? `, by ${esc(p.table1.stratify_by)}` : ""}: ${esc(p.table1.variables.join(", "))}.` : `No Table 1 was proposed; ask for a new draft, or add it under “Correct the details myself”.`}
      The analyses then run in the standard order: data quality, Table 1, descriptive, univariable, multivariable with diagnostics.</p>
    <p class="small">${locked ? `<span class="tag good">Locked</span> Every author confirmed this plan before any result existed.`
      : `Confirmed by ${confirmedBy.length} of ${s.authors.length} authors${confirmedBy.length ? ` (${esc(confirmedBy.map(name).join(", "))})` : ""}. A change to the plan needs every author to confirm again.`}</p>
    <form data-form="planconfirm">
      <div class="tablewrap"><table class="plantable"><thead><tr><th title="Include in this paper">Include</th><th>Analysis</th><th>Planned as</th><th title="Described in the protocol; named primary; covered by the sample-size calculation">Checks</th></tr></thead><tbody>
      ${items.map((a, i) => { const out = a.included === false; return `<tr>
        <td class="inc"><input type="checkbox" name="inc:${esc(a.id)}" data-inc="${esc(a.id)}" ${out ? "" : "checked"} ${editable ? "" : "disabled"} aria-label="Include ${esc(a.title || a.id)}"></td>
        <td><strong>${i + 1}. ${esc(a.title || a.id)}</strong> <span class="tag">${esc(a.kind || "other")}</span>
          <div id="why-${esc(a.id)}" style="${out ? "" : "display:none"};margin-top:.35rem"><input type="text" name="why:${esc(a.id)}" value="${esc(a.exclusion_reason || "")}" placeholder="Why is it left out? The draft will say." ${editable ? "" : "disabled"} style="width:100%"></div>
          <details class="small"><summary>Why ${out ? "left out" : a.label === "confirmatory" ? "confirmatory" : "exploratory"}, and the details</summary>${planItemBody(a)}</details></td>
        <td>${out ? `<span class="tag">left out</span>` : a.label ? labelTag({ label: a.label, basis: "pre-specified", primary_basis: a.design?.primary_basis }) : ""}</td>
        <td class="ticks">${ticks(a)}</td></tr>`; }).join("")}
      </tbody></table></div>
      <p class="small muted">Checks, in order: described in the protocol; the primary analysis (named so by the protocol, or by the authors with a reason that the draft discloses); covered by the sample-size calculation. An analysis is confirmatory only with all three; anything else is reported as exploratory. To name a primary, use “Correct the details myself”.</p>
      ${canAct && !locked ? (!s.plan_confirmed_by.includes(S.you)
        ? `<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center"><button class="btn" data-label="Confirming">Confirm this plan</button>
            <span class="small muted">If you changed which analyses are included, your choice is saved as a revised plan and confirmed in one step.</span></div>`
        : `<p><span class="tag good">You confirmed this version</span> <button class="btn quiet" data-label="Saving">Save changed choices</button></p>`) : ""}
    </form>
    ${canAct && !locked ? `<details style="margin-top:1rem"><summary>Something wrong in the plan?</summary>
      <p class="small">Most problems are fixed by asking the agent again, with an instruction. You can also correct a quotation, a role or the planned numbers yourself; code checks your changes against the protocol in the same way.</p>
      ${prepareBox(true)}
      <button class="btn quiet" data-action="editplan">Correct the details myself</button></details>` : ""}
  </section>`;
}

function departureHtml(dev, by) {
  if (!dev) return "";
  return `<div class="msg warn small"><strong>Departure from the protocol, to be disclosed.</strong> ${esc(dev.statement)}.${by ? ` Decided by ${esc(name(by))}.` : ""}
    The draft must say so, citing this analysis, and the reviewer sees it.</div>`;
}

const DESIGN_NAMES = { cross_sectional: "Cross-sectional study", cohort: "Cohort study", case_control: "Case-control study",
  rct: "Randomised controlled trial", diagnostic_accuracy: "Diagnostic accuracy study", prediction_model: "Prediction model study",
  systematic_review: "Systematic review", qualitative: "Qualitative study", other: "Other design" };
const GUIDELINE = { cross_sectional: "STROBE (cross-sectional)", cohort: "STROBE (cohort)", case_control: "STROBE (case-control)",
  rct: "CONSORT", diagnostic_accuracy: "STARD", prediction_model: "TRIPOD+AI", systematic_review: "PRISMA 2020",
  qualitative: "SRQR / COREQ", other: "STROBE (general)" };
function reportBox(p, canTalk) {
  const r = p.report || {}, design = r.design || "other";
  const unresolved = p.order.flatMap((id) => (p.analyses[id].included === false ? [] : (p.analyses[id].unresolved || []).map((u) => `${p.analyses[id].title || id}: ${u}`)));
  const qs = [...(r.questions || []), ...unresolved];
  return `<section class="reportbox"><h2 class="step">What this paper reports <span class="who">Settled with the authors before any analysis; the Writing Agent writes to it.</span></h2>
    <dl class="facts"><dt>Aim</dt><dd>${r.aim ? esc(r.aim) : `<span class="muted">Not stated yet. Tell Saksi below, or ask for a new draft.</span>`}</dd>
      <dt>Study design</dt><dd>${esc(DESIGN_NAMES[design])}: the paper is written and checked against the <strong>${esc(GUIDELINE[design])}</strong> reporting guideline.</dd></dl>
    ${qs.length ? `<p class="small"><strong>Saksi's questions for you</strong></p><ol class="small">${qs.map((q) => `<li>${esc(q)}</li>`).join("")}</ol>` : ""}
    ${canTalk ? `<div class="chat">${(S.planChat || []).map((m, i) => `<p class="cm ${m.who}"><strong>${m.who === "you" ? "You" : "Saksi AI"}:</strong> ${esc(m.text)}
        ${m.pending ? `<button class="linkish" data-action="planredraft" data-i="${i}" data-label="Redrafting">Yes, redraft the plan this way</button>` : ""}</p>`).join("")}
      <form class="chatform" data-form="planchat"><span class="aibadge">AI</span><input type="text" name="message" required autocomplete="off" aria-label="Message to Saksi about this paper"
        placeholder="${qs.length ? "Answer Saksi's questions, or say what this paper should report" : "Say what this paper should report, or ask Saksi"}"><button class="btn" data-label="Saksi AI is thinking">Send</button></form></div>` : ""}
  </section>`;
}

function planItemBody(a) {
  return planItem(a, -1).replace(/^<div class="item[^"]*">\s*<h3>[\s\S]*?<\/h3>/, "<div>");
}

function planItem(a, i) {
  const d = a.design || {}, out = a.included === false;
  const col = (v) => v?.column ? `${esc(v.name)} <span class="muted">(${esc(v.column)})</span>` : `${esc(v?.name || "")} <span class="tag attn">no column</span>`;
  const conds = d.conditions || [];
  const wording = { described: d.quotes?.described, primary: d.quotes?.primary, powered: d.quotes?.sample_size };
  const t = d.sample_size_target || {};
  return `<div class="item ${out ? "" : d.label === "confirmatory" ? "good" : "attn"}">
    <h3>${i + 1}. ${esc(a.title || a.id)} ${out ? `<span class="tag">left out of this paper</span>` : a.label ? labelTag({ label: a.label, basis: "pre-specified", primary_basis: a.design?.primary_basis }) : ""} <span class="muted small">${esc(a.id)}</span></h3>
    ${out ? `<p class="small"><strong>Left out:</strong> ${esc(a.exclusion_reason)}. The draft will name it as a protocol analysis not performed.</p>` : ""}
    ${departureHtml(d.deviation, a.primary_reason_by)}
    ${conds.length ? `<ul class="checks">${conds.map((c) => {
      const w = wording[c.key];
      return `<li class="${c.met ? "met" : "unmet"}"><span class="mark">${c.met ? "✓" : "✗"}</span><div><strong>${esc(c.label)}.</strong> <span class="small">${esc(c.detail[0].toUpperCase() + c.detail.slice(1))}.</span>
        ${w?.protocol_text && w.status === "close" ? `<blockquote class="small">Protocol: “${esc(w.protocol_text)}”</blockquote>` : ""}
        ${c.key === "described" && a.protocol_quote ? `<blockquote class="small">${esc(a.protocol_quote)}</blockquote>` : ""}
        ${c.key === "primary" && d.primary_quote ? `<blockquote class="small">${esc(d.primary_quote)}</blockquote>` : ""}
        ${c.key === "powered" && d.sample_size_quote ? `<blockquote class="small">${esc(d.sample_size_quote)}</blockquote>${t.n || t.events ? `<p class="small muted">Planned: ${t.n ? esc(t.n) + " participants" : ""}${t.n && t.events ? ", " : ""}${t.events ? esc(t.events) + " outcome events" : ""}</p>` : ""}` : ""}
      </div></li>`; }).join("")}</ul>`
      : `<p class="small">${esc((d.reasons_not_confirmatory || []).join("; ") || "")}</p>`}
    ${a.columns_not_in_data?.length ? `<p><span class="tag attn">Not in the data: ${esc(a.columns_not_in_data.join(", "))}</span></p>` : ""}
    <details><summary>Specification</summary><dl class="facts"><dt>Objective</dt><dd>${esc(a.objective)}</dd><dt>Outcome</dt><dd>${col(a.outcome)}</dd>
      <dt>Exposures</dt><dd>${(a.exposures || []).map(col).join(", ") || "none"}</dd><dt>Covariates</dt><dd>${(a.covariates || []).map(col).join(", ") || "none"}</dd>
      <dt>Method</dt><dd>${esc(a.method)}</dd><dt>Effect measure</dt><dd>${esc(a.effect_measure)}</dd><dt>Missing data</dt><dd>${esc(a.missing_data)}</dd>
      ${a.unresolved?.length ? `<dt>Unresolved</dt><dd>${esc(a.unresolved.join("; "))}</dd>` : ""}</dl></details>
  </div>`;
}

function planEditor(p) {
  const f = (id, k) => `${k}:${id}`;
  return `<section><h2>Edit the plan</h2>
    <p class="small">Choose which of the protocol's analyses this paper includes, and correct what the Analysis Agent got wrong. For quotations, paste the protocol's own words: code checks them against the protocol again when you save. Saving creates a revised plan that every author confirms; the record keeps both versions.</p>
    <form class="stack" data-form="planedit" style="max-width:none">
    <fieldset class="edit"><legend>What this paper reports</legend>
      <label><span>Aim of this paper (one or two sentences)</span><textarea name="aim">${esc(p.report?.aim || "")}</textarea></label>
      <label><span>Study design (sets the reporting guideline)</span><select name="design">${Object.entries(DESIGN_NAMES).map(([k, v]) => `<option value="${k}" ${(p.report?.design || "other") === k ? "selected" : ""}>${esc(v)}: ${esc(GUIDELINE[k])}</option>`).join("")}</select></label></fieldset>
    <fieldset class="edit"><legend>Table 1</legend>
      <label><span>Stratify by (a column, usually the outcome; leave empty for no stratification)</span><input type="text" name="t1by" value="${esc(p.table1?.stratify_by || "")}"></label>
      <label><span>Characteristics (column names, separated by commas)</span><textarea name="t1vars">${esc((p.table1?.variables || []).join(", "))}</textarea></label></fieldset>
    ${p.order.map((id, i) => { const a = p.analyses[id], d = a.design || {}, t = d.sample_size_target || {}; return `<fieldset class="edit">
      <legend>${i + 1}. ${esc(a.title || id)} <span class="muted small">${esc(id)}</span></legend>
      <label class="inline"><input type="checkbox" name="${f(id, "inc")}" ${a.included === false ? "" : "checked"}> Include in this paper</label>
      <label><span>If left out, why (required; the draft will report it)</span><input type="text" name="${f(id, "why")}" value="${esc(a.exclusion_reason || "")}"></label>
      <label><span>Place in the standard sequence</span><select name="${f(id, "kind")}">${["descriptive", "univariable", "multivariable", "other"].map((k) => `<option value="${k}" ${a.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select></label>
      <label><span>Role (as in the protocol, unless the authors decide otherwise below)</span><select name="${f(id, "role")}">${["primary", "secondary", "other"].map((r) => `<option value="${r}" ${(d.role || a.role) === r ? "selected" : ""}>${r}</option>`).join("")}</select></label>
      <label><span>Protocol sentence describing this analysis</span><textarea name="${f(id, "pq")}">${esc(a.protocol_quote || "")}</textarea></label>
      <label><span>Protocol sentence naming it the primary analysis (primary analyses only)</span><textarea name="${f(id, "prq")}">${esc(d.primary_quote || a.primary_quote || "")}</textarea></label>
      <label><span>Authors' decision: if you name this the primary analysis although the protocol does not, or you change the protocol's primary, say why. The draft will disclose it and the reviewer will see it</span><textarea name="${f(id, "prr")}" placeholder="Leave empty if the roles follow the protocol">${esc(a.primary_reason || "")}</textarea></label>
      <label><span>The protocol's sample-size justification, if it covers this analysis</span><textarea name="${f(id, "ssq")}">${esc(d.sample_size_quote || a.sample_size_quote || "")}</textarea></label>
      <div class="row2"><label><span>Planned participants</span><input type="text" inputmode="numeric" name="${f(id, "n")}" value="${esc(t.n ?? "")}"></label>
        <label><span>Planned outcome events</span><input type="text" inputmode="numeric" name="${f(id, "ev")}" value="${esc(t.events ?? "")}"></label></div>
      <label><span>Method</span><input type="text" name="${f(id, "method")}" value="${esc(a.method || "")}"></label>
      <label><span>Missing data</span><input type="text" name="${f(id, "md")}" value="${esc(a.missing_data || "")}"></label>
    </fieldset>`; }).join("")}
    <label><span>What you changed and why (required; kept in the record)</span><textarea name="note" required></textarea></label>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" data-label="Saving">Save as a revised plan</button>
      <button class="btn quiet" type="button" data-action="canceledit">Cancel</button></div></form></section>`;
}

function sampleBlock(c) {
  if (!c) return "";
  const rows = Object.entries(c.targets).map(([k, r]) => `${k === "n" ? "Participants" : "Outcome events"}: ${r.achieved ?? "not reported"} analysed, ${r.target} planned${r.short ? " (short)" : ""}`);
  return `<div class="msg ${c.shortfall ? "warn" : "ok"} small"><strong>${c.shortfall ? "Below the protocol's planned sample." : "The protocol's planned sample was reached."}</strong> ${esc(rows.join("; "))}.
    ${c.shortfall ? " So the study could not answer this question with the power it planned: the text reports it as exploratory and states the planned and achieved numbers (decided from the counts, never the estimates)." : " The text states this: the study had the size it planned to answer the question."}</div>`;
}

/* Figures: SVG text from the record, shown as images so nothing in them can run */
function svgURI(svg) {
  const bytes = new TextEncoder().encode(svg);
  let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return "data:image/svg+xml;base64," + btoa(bin);
}
async function figureHtml(f, plain = false) {
  const uri = svgURI(await blob(f.svg_sha256) || "");
  const c = f.caption_check || {};
  const problems = (c.untraced ? `${c.untraced} number${c.untraced > 1 ? "s" : ""} not in the results` : "")
    + (c.exploratory_not_labelled ? `${c.untraced ? "; " : ""}does not say exploratory` : "");
  return `<figure class="fig"><img src="${uri}" alt="Figure ${f.number || "(replaced)"}: ${esc(f.caption)}" loading="lazy">
    <figcaption><strong>${f.number ? `Figure ${f.number}.` : "Replaced figure."}</strong> ${esc(f.caption)}
    ${plain ? "" : `<br><span class="small muted">${f.drawn_by === "saksi" ? "Drawn by Saksi from the recorded results, without a model" : "Drawn by the analysis code in the sandbox, from the data"}.</span>
    ${problems ? `<span class="tag attn">caption: ${esc(problems)}</span>` : `<span class="tag good">caption checked</span>`}
    ${f.warning ? `<span class="tag bad">${esc(f.warning)}</span>` : ""}
    <a class="small" href="${uri}" download="saksi-figure-${f.number || "replaced"}.svg">Download SVG</a>`}</figcaption></figure>`;
}

/* Publication-ready tables: built on the server from the recorded results, no model */
async function tablesNow() {
  const seq = S.state.head_seq;
  if (S.tables?.pid !== S.pid || S.tables?.seq !== seq) {
    let list = [];
    try { list = (await api(`/projects/${S.pid}/tables`)).tables || []; } catch { /* shown as no tables */ }
    S.tables = { pid: S.pid, seq, list };
  }
  return S.tables.list;
}
const noteHtml = (n) => { const m = /^([a-j]) (.*)$/.exec(n); return m ? `<sup>${esc(m[1])}</sup> ${esc(m[2])}` : esc(n); };
function tableEditors() {
  const s = S.state, names = new Set();
  let prev = null;
  for (const v of Object.keys(s.drafts).map(Number).sort((a, b) => a - b)) {
    const d = s.drafts[v];
    if (d.table_edits_sha256 && d.table_edits_sha256 !== prev) names.add(name(d.by));
    prev = d.table_edits_sha256 || null;
  }
  return [...names].join(", ");
}
function pubTableHtml(t, { editable = false, note = "" } = {}) {
  const ce = (k) => editable ? ` contenteditable="true" data-te="${k}"` : "";
  const head = t.columns.map((c, j) => `<th class="${j ? "r" : ""}"${ce("col:" + j)}>${esc(c).replace(/\n/g, "<br>")}</th>`).join("");
  const body = t.rows.map((r, i) => `<tr>${r.cells.map((c, j) => { const mk = (r.marks || {})[j];
    return `<td class="${j ? "r" : ""}${r.indent && !j ? " ind" : ""}${editable && j ? " locked" : ""}"${j ? (editable ? ' title="From the computed results: numbers cannot be edited"' : "") : ce("row:" + i)}>${esc(c)}${mk ? `<sup>${esc(mk)}</sup>` : ""}</td>`; }).join("")}</tr>`).join("");
  return `<div class="pubtable" id="pt-${t.number}" data-aid="${esc(t.analysis_id)}"><p class="ptitle"><strong>Table ${t.number}.</strong> <span${ce("title")}>${esc(t.title)}</span></p>
    <div class="tablewrap"><table class="pub"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="pnotes">${t.footnotes.map((n, k) => `<p${ce("note:" + k)}>${noteHtml(n)}</p>`).join("")}</div>
    ${t.edited?.length && !editable ? `<p class="edited-note">Wording edited by ${esc(tableEditors() || "an author")}; the numbers are as computed.</p>` : ""}
    ${note ? `<p class="small muted">${note}</p>` : ""}</div>`;
}
async function downloadTables(n) {
  const r = await fetch(`/projects/${S.pid}/tables.docx${n ? "?number=" + n : ""}`, { headers: { "X-Saksi-Token": S.token } });
  if (!r.ok) throw new Error(`The tables could not be prepared (the server answered ${r.status}).`);
  const url = URL.createObjectURL(await r.blob());
  const link = Object.assign(document.createElement("a"), { href: url, download: `saksi-${S.pid}-${n ? "table-" + n : "tables"}.docx` });
  document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const TABLE_NOTE = "Built by Saksi from the recorded results, without a model. It goes into the draft's Results, where the text first refers to it; the authors can reword it there, but not change its numbers.";

/* Analyses: the standard sequence */
const SEQ = [
  ["quality", "1. Data quality", "Saksi's own code, not a model: missing values, duplicate records and outliers. Counts only. Its text belongs in Methods (statistical analysis)."],
  ["table1", "2. Table 1: characteristics of the sample", "Saksi's own code, not a model. Summary and test chosen by rule from the data; the plan chose the variables and the grouping."],
  ["descriptive", "3. Other descriptive analyses", "From the plan, written by the Analysis Agent."],
  ["univariable", "4. Univariable analyses", "One independent variable at a time, before any adjustment."],
  ["multivariable", "5. Multivariable analyses and model diagnostics", "Adjusted models. After each, Saksi's standard checks: fit, calibration, influence and assumptions."],
  ["other", "6. Other planned analyses", ""],
  ["posthoc", "7. Analyses added after the plan", "Not in the confirmed plan, so the text reports them as exploratory."]];
const KIND_RANK = { descriptive: 0, univariable: 1, multivariable: 2, other: 3 };
function stepOf(a) {
  if (a.standard === "data_quality") return "quality";
  if (a.standard === "table1") return "table1";
  if (a.basis === "post hoc") return "posthoc";
  return ["descriptive", "univariable", "multivariable"].includes(a.kind) ? a.kind : "other";
}
function sequenceIds(plan) {
  const ids = (plan?.order || []).filter((i) => plan.analyses[i].included !== false);
  return [...ids].sort((x, y) => (KIND_RANK[plan.analyses[x].kind] ?? 3) - (KIND_RANK[plan.analyses[y].kind] ?? 3) || ids.indexOf(x) - ids.indexOf(y));
}
function pendingSteps() {
  const s = S.state, done = (pred) => Object.values(s.analyses).some((a) => pred(a) && a.status === "ok"), q = [];
  if (!done((a) => a.standard === "data_quality")) q.push({ args: { standard_step: "data_quality" }, label: "data quality" });
  if (s.plan_locked?.table1 && !done((a) => a.standard === "table1")) q.push({ args: { standard_step: "table1" }, label: "Table 1" });
  for (const id of sequenceIds(s.plan_locked)) {
    if (!done((a) => a.plan_analysis_id === id)) q.push({ args: { plan_analysis_id: id }, label: s.plan_locked.analyses[id].title || id });
  }
  return q;
}

function qualityHtml(o) {
  const issues = (o.columns || []).filter((c) => c.missing || c.outliers_beyond_1_5_iqr).sort((a, b) => b.missing - a.missing);
  return `<p>${esc(o.n_rows)} records and ${esc(o.n_columns)} columns. Duplicated records: ${esc(o.duplicate_rows)}. Records missing more than a fifth of their values: ${esc(o.rows_over_20pct_missing)}. Columns with any missing value: ${esc(o.columns_with_missing)}.${o.constant_columns?.length ? ` Columns holding a single value: ${esc(o.constant_columns.join(", "))}.` : ""}</p>
    ${issues.length ? `<details ${issues.length <= 12 ? "open" : ""}><summary>${issues.length} column${issues.length > 1 ? "s" : ""} with missing values or outliers</summary><div class="tablewrap"><table><thead><tr><th>Column</th><th>Missing</th><th>%</th><th>Outliers (1.5 × IQR)</th><th>Extreme (3 × IQR)</th><th>Range</th></tr></thead><tbody>
      ${issues.map((c) => `<tr><td>${esc(c.column)}</td><td class="num">${esc(c.missing)}</td><td class="num">${esc(c.missing_pct)}</td><td class="num">${esc(c.outliers_beyond_1_5_iqr ?? "")}</td><td class="num">${esc(c.extreme_beyond_3_iqr ?? "")}</td><td class="num">${c.min != null ? `${num(c.min, 1)} to ${num(c.max, 1)}` : ""}</td></tr>`).join("")}</tbody></table></div>
      <p class="small muted">Outliers are counted, not removed. Removing one needs a reason, and the analysis is then reported with and without it.</p></details>` : `<p class="small">No missing values or outliers.</p>`}`;
}

function table1Html(t) {
  const g = t.groups || [], by = t.stratify_by;
  const fmt = (x, summary) => !x || !x.n ? "" : summary === "mean (SD)" ? `${num(x.mean, 1)} (${num(x.sd, 1)})` : `${num(x.median, 1)} (${num(x.q1, 1)} to ${num(x.q3, 1)})`;
  const np = (x) => x ? `${esc(x.n)} (${num(x.pct, 1)})` : "";
  const tests = [...new Set((t.rows || []).map((r) => r.test).filter(Boolean))];
  const body = (t.rows || []).map((r) => {
    if (r.error) return `<tr><td>${esc(r.variable)}</td><td colspan="${g.length + 2}" class="small muted">${esc(r.error)}</td></tr>`;
    const miss = r.missing ? ` <span class="small muted">(${esc(r.missing)} missing)</span>` : "";
    const p = g.length ? `<td title="${esc(r.test || "")}${r.test_note ? ": " + esc(r.test_note) : ""}">${pval(r.p_value)}${r.test_note ? "*" : ""}</td>` : "";
    if (r.type === "continuous") return `<tr><td>${esc(r.variable)}, ${esc(r.summary)}${miss}</td><td>${fmt(r.overall, r.summary)}</td>${g.map((x) => `<td>${fmt(r.by_group?.[x.level], r.summary)}</td>`).join("")}${p}</tr>`;
    return `<tr><td>${esc(r.variable)}, n (%)${miss}</td><td></td>${g.map(() => "<td></td>").join("")}${p}</tr>`
      + (r.categories || []).map((c) => `<tr class="cat"><td>${esc(c.level)}</td><td>${np(c.overall)}</td>${g.map((x) => `<td>${np(c.by_group?.[x.level])}</td>`).join("")}${g.length ? "<td></td>" : ""}</tr>`).join("");
  }).join("");
  return `<div class="tablewrap"><table class="t1"><thead><tr><th>Characteristic</th><th>Overall<br><span class="small muted">n = ${esc(t.n_analysed)}</span></th>
    ${g.map((x) => `<th>${esc(by)} = ${esc(x.level)}<br><span class="small muted">n = ${esc(x.n)}</span></th>`).join("")}${g.length ? "<th>p</th>" : ""}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="small muted">${t.rows?.some((r) => r.test_note) ? "* More than a fifth of the expected counts are below 5; read this p-value with care. " : ""}${tests.length ? `Tests: ${esc(tests.join(", "))}. ` : ""}${t.n_excluded ? `${esc(t.n_excluded)} records without ${esc(by)} are not shown. ` : ""}${esc((t.notes || []).join(" "))}</p>`;
}

function diagnosticsHtml(d) {
  if (!d || typeof d !== "object") return "";
  const a = d.assumptions || {}, f = d.fit || {}, i = d.influence || {}, col = a.collinearity || {};
  const vifs = Object.entries(col.vif || {}).map(([k, v]) => `${esc(k)} ${num(v, 2)}`).join(", ");
  const bt = Object.entries(a.linearity_box_tidwell || {}).map(([k, v]) => `${esc(k)}: p ${pval(v.p_value)}${v.nonlinear ? " (may not be linear)" : ""}`).join("; ");
  const lr = f.likelihood_ratio || {}, cal = f.calibration || {}, hl = cal.hosmer_lemeshow || {};
  return `<div class="diag"><h4>Model diagnostics <span class="small muted">computed by Saksi's standard checks</span></h4>
    ${(d.flags || []).length ? `<ul class="msg warn small flags">${d.flags.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="msg ok small">Nothing flagged by the standard thresholds.</p>`}
    <dl class="facts">
