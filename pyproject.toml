[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saksi"
version = "0.1.0"
description = "Research that is witnessed, not reconstructed."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Boon-How Chew" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "python-multipart",
  "numpy",            # dataset profile
  "pandas",           # dataset profile
  "openpyxl",         # .xlsx datasets
  "pypdf",            # protocol text from PDF
  "python-docx",      # protocol text from Word
]

[project.optional-dependencies]
# What analyses import inside the sandbox (pinned there; see saksi/sandbox.py).
analysis = ["scipy", "statsmodels", "scikit-learn", "matplotlib"]
deploy = ["modal==1.6.3"]
dev = ["pytest", "modal==1.6.3", "scipy", "statsmodels", "scikit-learn", "matplotlib", "uvicorn"]

[tool.setuptools]
packages = ["saksi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
